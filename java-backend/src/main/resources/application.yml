spring:
  application:
    name: tcm-ehr-qc

  # MySQL（Docker 容器 windows-mysql → localhost:3306）
  datasource:
    # rewriteBatchedStatements=true：批写才能合并成多值 INSERT，是批处理减少往返的前提
    url: jdbc:mysql://localhost:3306/tcm_ehr?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    # 默认值为本地容器口令；生产用 DB_PASSWORD 覆盖
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接数是 MySQL 端上限，单实例 20 已足够，盲目调大会先撞库上限
      maximum-pool-size: 20
      minimum-idle: 5
      # 先于 MySQL wait_timeout(8h) 回收，避免拿到死连接
      max-lifetime: 1800000
      connection-timeout: 30000

  # 版本管理：表结构由 database-init.sql 建立，Flyway 从基线 v1 接管后续增量（db/migration/V2__*.sql）
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "基线：database-init.sql 建立的全量表结构"
    validate-on-migrate: true

  # Redis（Docker 容器 windows-redis → localhost:6379）
  data:
    redis:
      host: localhost
      port: 6379
      # 默认值为本地容器口令；生产用 REDIS_PASSWORD 覆盖
      password: ${REDIS_PASSWORD:123456}
      # 本项目独占 db1，避免与同机其它应用混用
      database: 1
      timeout: 5000

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

  # 关掉模型自动装配：OpenAi*AutoConfiguration 会急切构造 Model，缺 api-key 时启动即失败；
  # 模型改由 LlmConfig 按需自建，故这里全置 none。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

# Elasticsearch（Docker 容器 windows-es → localhost:9200）
elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  score-threshold: 0.8

# 术语词典目录（JSON 已打包进 jar，无需服务器另放文件；可改外部目录覆盖）
dictionary:
  dir: classpath:dictionaries

# 质控（规则权威 = qc_rules 表，每组织一行；无行回退内置默认）
qc:
  batch:
    # 提交时的范围上限（目标数据集约 4 万条）
    max-records: 40000
    # 写密集；同一组织同时只允许一个任务，调大只对多组织并行有意义
    concurrency: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 不设 log-impl：走 slf4j，仅在 debug 输出 SQL。StdOutImpl 会把病历正文打进日志且拖慢批处理。

server:
  port: 8080

# JWT：生产用 JWT_SECRET 覆盖（轮换见 tools/rotate-jwt-secret.py）
jwt:
  secret: ${JWT_SECRET:tcm-ehr-qc-jwt-secret-key-2026-course-design}
  expire-hours: 24

# NLP 抽取：转发到独立 Python 服务（须先启动 python-nlp）
nlp:
  enabled: true             # 总开关；false 时单条与批量抽取都不可用。改动需重启
  service-url: http://localhost:8001
  timeout: 30000            # 毫秒
  batch:
    # 后台并发：同时运行的任务数 + 单任务内并行条数；与 Python 侧 NLP_INFER_CONCURRENCY 对齐
    concurrency: 8

# LLM 增强：默认关闭，失败回退规则兜底
llm:
  enabled: false              # 启动基线，运行时被「导入 LLM」覆盖
  provider: ollama            # ollama | openai
  base-url: ""                # 留空用通道默认
  api-key: ""                 # openai 时必填
  model: ""                   # 留空用通道默认模型
  temperature: 0.2
  timeout: 20000              # 毫秒
  # 分功能的局部开关（启动基线）：总开关开启时逐项生效，关闭项回退规则输出
  interpret-enabled: true     # AI 解读
  review-enabled: true        # 复核意见
  term-suggest-enabled: true  # 术语建议
  # 用户密钥落库加密密钥（AES-256-GCM）。换掉后已加密的 API Key 全部解不开，须当持久密钥保管；
  # 生产用 TCM_LLM_ENC_KEY 覆盖（优先级更高）。生成/轮换见 tools/init-llm-enc-key.py
  crypto-key: ${TCM_LLM_ENC_KEY:dGNtLWVoci1xYy1kZXYtb25seS1sbG0tZW5jLWtleSE=}

# 认证
auth:
  # false = 管理员也看不到他组数据（数据主权在组），只改这一行即可收紧
  admin-can-view-data: true

logging:
  level:
    com.tcm.ehr: info
    org.springframework.web: info
