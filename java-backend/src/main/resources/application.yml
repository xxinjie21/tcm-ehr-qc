spring:
  application:
    name: tcm-ehr-qc

  # 数据源（连接 Docker 中的 windows-mysql 容器，宿主机端口3306）
  datasource:
    url: jdbc:mysql://localhost:3306/tcm_ehr?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis（连接 Docker 中的 windows-redis 容器，宿主机端口6379）
  data:
    redis:
      host: localhost
      port: 6379
      password: "123456"
      database: 0
      timeout: 5000

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

  # 模型自动装配一律关掉：六个 OpenAi*AutoConfiguration 的 matchIfMissing=true，
  # 只要 spring-ai-starter-model-openai 在类路径上就会急切构造六个 Model，
  # 缺 api-key 时上下文刷新即抛 IllegalStateException 导致启动失败。
  # 模型改由 LlmConfig 按需自建，故置 none 后无需填假 api-key 也能启动。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

# Elasticsearch（连接 Docker 中的 windows-es 容器，宿主机端口9200）
elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  score-threshold: 0.8

# 术语词典目录（JSON文件存储，本仓库 data/dictionaries）
dictionary:
  dir: D:/ZISHIKU/AI/tcm-ehr-qc/data/dictionaries

# MyBatis-Plus（实体/Mapper由注解与BaseMapper自动管理）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

# JWT配置
jwt:
  secret: tcm-ehr-qc-jwt-secret-key-2026-course-design
  expire-hours: 24

# NLP 抽取：Java 经 PythonNlpClient 转发到独立的 Python 服务
nlp:
  enabled: true             # 抽取总开关。开启前必须先启动 python-nlp，否则抽取要等连接超时才降级；
                            # false 时单条抽取与批量任务都不可用。改它必须重启。
  service-url: http://localhost:8001
  timeout: 30000            # 毫秒
  batch:
    concurrency: 2          # 批量解析后台并发线程数；调大缩短总耗时，但会同时压 Python NLP（单条推理数百毫秒）

# LLM 增强（Spring AI 2.0；provider 二选一：ollama 本机 / openai 及兼容三方）
# 默认关闭；关闭或调用失败时回退规则兜底，不阻塞主流程（模型装配见上方 spring.ai.model）
llm:
  enabled: false              # 总控。此处只是启动基线，运行时被「导入 LLM」经 LlmConfigStore 覆盖
  convert-enabled: true       # 词典 PDF 智能转换子开关，受 llm.enabled 总控约束（总控关闭时上传 PDF 回 400）。
                              # 静态 @Value，改完要重启；默认开，使「导入 LLM = AI 功能都开」成立
  provider: ollama            # ollama | openai
  base-url: ""                # 留空用通道默认：ollama=http://localhost:11434，openai=https://api.openai.com/v1
  api-key: ""                 # provider=openai 时必填；留空则该通道降级（不影响启动）
  model: ""                   # 留空用通道默认模型；ollama 例 qwen2.5:7b，openai 例 gpt-4o-mini
  temperature: 0.2
  timeout: 60000              # 毫秒
  config-file: D:/ZISHIKU/AI/tcm-ehr-qc/data/llm-config.json   # 非密钥字段持久化（重启回显）；api-key 不落盘

# 操作日志（绝对路径，避免随启动目录漂移）
log:
  operation-file: D:/ZISHIKU/AI/tcm-ehr-qc/logs/operation.log

logging:
  level:
    com.tcm.ehr: debug
    org.springframework.web: info
