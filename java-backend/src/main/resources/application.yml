spring:
  application:
    name: tcm-ehr-qc

  # 数据源（连接 Docker 中的 windows-mysql 容器，宿主机端口3306）
  datasource:
    url: jdbc:mysql://localhost:3306/tcm_ehr?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis（连接 Docker 中的 windows-redis 容器，宿主机端口6379）
  data:
    redis:
      host: localhost
      port: 6379
      password: "123456"
      database: 0
      timeout: 5000

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

  # Spring AI 2.0：默认关闭全部模型自动装配。
  # 六个 OpenAi*AutoConfiguration 的开关默认值均为 openai（matchIfMissing=true），
  # 只要 spring-ai-starter-model-openai 在类路径上就会急切构造 ChatModel / EmbeddingModel /
  # ImageModel / AudioSpeechModel / AudioTranscriptionModel / ModerationModel，
  # 未配置 api-key 时会在上下文刷新阶段直接抛 IllegalStateException 导致启动失败。
  # 本项目 LLM 属可选增强（见 llm.enabled），默认关闭，故此处一律置 none，
  # 需要启用时由 LlmConfig 自行构造 ChatModel（避免被迫填假 api-key）。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

# Elasticsearch（连接 Docker 中的 windows-es 容器，宿主机端口9200）
elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  score-threshold: 0.8

# 术语词典目录（JSON文件存储，本仓库 data/dictionaries）
dictionary:
  dir: D:/ZISHIKU/AI/tcm-ehr-qc/data/dictionaries

# MyBatis-Plus（实体/Mapper由注解与BaseMapper自动管理）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

# JWT配置
jwt:
  secret: tcm-ehr-qc-jwt-secret-key-2026-course-design
  expire-hours: 24

# NLP 抽取（批G·8.1）：Python FastAPI 服务（成员B），Java 经 PythonNlpClient 转发
nlp:
  enabled: true             # 抽取总开关（2026-09-22 由 false 改为 true，按用户要求默认开启）。
                            # true 时经 PythonNlpClient 调用 :8001 的 python-nlp 服务；
                            # 注意：开启前需先启动该服务（python-nlp/.venv/Scripts/python.exe
                            # -m uvicorn main:app --host 127.0.0.1 --port 8001），否则每次抽取
                            # 要等 3s 连接超时才降级，且导入病历会被逐条串行阻塞。
                            # false 时不发请求，接口直接返回空 9 类（modelAvailable=false）。
  service-url: http://localhost:8001
  timeout: 30000            # 毫秒
  extract-on-import: true   # 批G·8.3：病历导入入库后自动抽取写 structured_data（仅 enabled=true 时生效）

# LLM 增强（Spring AI 2.0；provider 二选一：ollama 本机 / openai 及兼容三方）
# 默认关闭，口径与 nlp.enabled 一致：关闭或调用失败时回退规则兜底，不阻塞主流程。
# 关闭时 Spring AI 的模型自动装配也一并置 none（见上方 spring.ai.model），
# 因此无需配置 api-key 即可启动；启用需同时设 llm.enabled=true。
llm:
  enabled: false              # 启动基线；运行时由「导入 LLM」经 LlmConfigStore 覆盖（LlmClient.isEnabled() 读的是它，不是这里）
  convert-enabled: true       # 词典 PDF 智能转换子开关（② LLM 即 ETL；2026-09-22 由 false 改为 true）。
                              # 2026-09-22 从 nlp 段挪到这里：真正干活的是 LlmClient（Spring AI ChatClient），
                              # python-nlp 源码里零个 convert 引用 —— 原先挂在 nlp 段下是批A 的历史遗留
                              #（那时 nlp 段还是「AI 能力开关区」，NLP 是 Java 进程内 DJL+ONNX、没有端口；
                              # 批G 把它改成 Python FastAPI 服务后，段名明确指 :8001，错位才显出来）。
                              # 故意用 @Value 静态读取（改完要重启），不并进 LlmProperties：那个类装的是
                              # 可被运行时覆盖的「连接参数」，这个是不可运行时改的「能力开关」，机制不同。
                              # 默认 true 是为了让「导入 LLM = AI 功能都开」成立：原先默认关闭且页面上无法
                              # 自助打开，管理员导入 LLM 后上传 PDF 仍报错，文案还暴露配置项名。
                              # 它仍是独立开关（单独关掉的能力保留）；总控是 llm.enabled，总控关闭时
                              # PDF 上传回 400，但文案改为说人话、不再提配置项名。
  provider: ollama            # ollama | openai
  base-url: ""                # 留空用通道默认：ollama=http://localhost:11434，openai=https://api.openai.com/v1
  api-key: ""                 # provider=openai 时必填；留空则该通道降级（不影响启动）
  model: ""                   # 留空用通道默认模型；ollama 例 qwen2.5:7b，openai 例 gpt-4o-mini
  temperature: 0.2
  timeout: 60000              # 毫秒

# 操作日志（绝对路径，避免随启动目录漂移）
log:
  operation-file: D:/ZISHIKU/AI/tcm-ehr-qc/logs/operation.log

logging:
  level:
    com.tcm.ehr: debug
    org.springframework.web: info
