spring:
  application:
    name: tcm-ehr-qc

  # 数据源（连接 Docker 中的 windows-mysql 容器，宿主机端口3306）
  datasource:
    url: jdbc:mysql://localhost:3306/tcm_ehr?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 批次17 · 17.2：口令改环境变量注入。冒号后是**本地 docker 容器**（windows-mysql）的口令，
    # 保留它是为了「本地默认可用」——拉下代码就能起；生产用 DB_PASSWORD 覆盖，仓库里不留生产口令。
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # §八 C1：不配 hikari 段时用 Hikari 默认的 maximum-pool-size=10，那是当前唯一的
    # 并发硬瓶颈（Tomcat 200 线程、Redis 共享连接都够）。多课题组 R2 要给**每个请求**
    # 加一次查组 DB 往返，不先抬池子的话并发能力会不升反降 —— 故 C1 是 R2 的前置条件。
    hikari:
      # 20 而不是 50：单实例 + 每请求 1 次短查询，20 已远超实际需要；
      # 连接数是 MySQL 端的上限（默认 max_connections=151），盲目调大会先撞库上限。
      maximum-pool-size: 20
      # 空闲连接回收：池长期保持 20 条会一直占着 MySQL 的连接槽
      minimum-idle: 5
      # 连接最长存活 30min：MySQL 默认 wait_timeout 是 8h，先于它回收可避免拿到死连接
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis（连接 Docker 中的 windows-redis 容器，宿主机端口6379）
  data:
    redis:
      host: localhost
      port: 6379
      # 批次17 · 17.2：同数据源口径 —— 本地 docker（windows-redis）默认值保留，生产用 REDIS_PASSWORD 覆盖
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 5000

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

  # 模型自动装配一律关掉：六个 OpenAi*AutoConfiguration 的 matchIfMissing=true，
  # 只要 spring-ai-starter-model-openai 在类路径上就会急切构造六个 Model，
  # 缺 api-key 时上下文刷新即抛 IllegalStateException 导致启动失败。
  # 模型改由 LlmConfig 按需自建，故置 none 后无需填假 api-key 也能启动。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

# Elasticsearch（连接 Docker 中的 windows-es 容器，宿主机端口9200）
elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  score-threshold: 0.8

# 术语词典目录（JSON文件存储，本仓库 data/dictionaries）
dictionary:
  dir: D:/ZISHIKU/AI/tcm-ehr-qc/data/dictionaries

# 质控（规则可配置；rules-file 缺失则用内置默认）
qc:
  batch:
    # §七 L4：40000 = 目标数据集规模（实测 35355 条 × 1.13 KB/条 ≈ 40MB）。
    # 原 30000 小于真实数据集，全库重算会直接抛「超出上限」。配合 L5 异步化后，
    # 这个值退化为「提交时的范围校验」，不再是同步长任务的硬瓶颈。
    max-records: 40000
    # §七 L5：异步重算 worker 的并发（重算写密集，不与在线查询抢库）
    concurrency: 1
  rules-file: D:/ZISHIKU/AI/tcm-ehr-qc/data/qc-rules.json

# MyBatis-Plus（实体/Mapper由注解与BaseMapper自动管理）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 刻意不设 log-impl：不指定时 MyBatis 走 slf4j，SQL 与绑定参数只在 debug 级别输出。
    # 设成 StdOutImpl 会把每次查询的 SQL 和绑定参数打到 stdout —— 病历正文 / 主诉 / 现病史
    # 与登录查询的用户名会整段进日志，同时显著拖慢批量操作。
    # 需要排查 SQL 时临时加：logging.level.com.tcm.ehr.mapper=debug（用完删掉）

server:
  port: 8080

# JWT配置
jwt:
  # 批次17 · 17.1：改为环境变量注入 —— 生产用 `JWT_SECRET` 覆盖即可，不必改本文件，
  # 这也是「轮换不需要动仓库」的前提。轮换工具见 tools/rotate-jwt-secret.py（默认演练）。
  #
  # ⚠️ 如实说明：冒号后仍保留了一个**开发用**默认值，所以本条**尚未**满足
  #    「全仓无明文固定 secret」这条验收。之所以没直接写成 ${JWT_SECRET:}：
  #    那样没设环境变量时启动会直接失败，对本地开发/演示是硬中断。
  #    要真正满足验收，需要「去掉默认值 + 读到空值时启动即报错（并提示怎么生成）+ 
  #    在 src/test/resources 给测试一份默认值」三步一起做，那是独立的一次改动。
  secret: ${JWT_SECRET:tcm-ehr-qc-jwt-secret-key-2026-course-design}
  expire-hours: 24

# NLP 抽取：Java 经 PythonNlpClient 转发到独立的 Python 服务
nlp:
  enabled: true             # 抽取总开关。开启前必须先启动 python-nlp，否则抽取要等连接超时才降级；
                            # false 时单条抽取与批量任务都不可用。改它必须重启。
  service-url: http://localhost:8001
  timeout: 30000            # 毫秒
  batch:
    concurrency: 2          # 批量解析后台并发线程数；调大缩短总耗时，但会同时压 Python NLP（单条推理数百毫秒）

# LLM 增强（Spring AI 2.0；provider 二选一：ollama 本机 / openai 及兼容三方）
# 默认关闭；关闭或调用失败时回退规则兜底，不阻塞主流程（模型装配见上方 spring.ai.model）
llm:
  enabled: false              # 总控。此处只是启动基线，运行时被「导入 LLM」经 LlmConfigStore 覆盖
  provider: ollama            # ollama | openai
  base-url: ""                # 留空用通道默认：ollama=http://localhost:11434，openai=https://api.openai.com/v1
  api-key: ""                 # provider=openai 时必填；留空则该通道降级（不影响启动）
  model: ""                   # 留空用通道默认模型；ollama 例 qwen2.5:7b，openai 例 gpt-4o-mini
  temperature: 0.2
  # 批次15 · 15.2：按场景下调到 20s 级。四个用途（AI 解读 / 助手 / 复核意见 / 对话）都是
  # **交互式**的 —— 用户在页面上等结果，60s 的等待已经等同于「卡住了」：他既不知道该不该刷新，
  # 也不知道还要等多久。20s 后走规则兜底（见本块上方注释）比让他干等 60s 更有用。
  # 这是配置项，模型慢（如本地小显卡跑大模型）时改回大值即可，不需要动代码。
  timeout: 20000              # 毫秒

  # 批次18 · 用户 LLM 密钥的**落库加密**密钥（AES-256-GCM，见 LlmSecretCipher）。
  # 为什么必须有它：配置改成「每个用户一份」后，密钥会跟着每个用户落库；
  # 没有加密密钥时服务照常启动，但「导入 LLM」保存密钥会被拒（503 + code=1011），
  # 也就是用户看到的「未配置 LLM 加密密钥，无法保存密钥」。
  #
  # 口径与上方 jwt.secret 完全一致：冒号后是**开发用**默认值（32 字节 Base64，
  # 明文是 "tcm-ehr-qc-dev-only-llm-enc-key!"），保证拉下代码就能用；
  # 生产用环境变量 TCM_LLM_ENC_KEY 覆盖 —— 它优先级更高
  # （LlmSecretCipher.resolveKey 先读 System.getenv，再读本项）。
  #
  # ⚠️ 与 jwt.secret 不同的是，换这个值的代价更重：GCM 密文绑定密钥，换掉之后
  #    user_llm_config 里已加密的 API Key 全部解不开（decrypt 返回空串并告警一次），
  #    用户表现为「配置看着还在、但模型调不通」，需要各自重填一次。
  #    故生产上要把它当**持久密钥**保管；生成/轮换用 tools/init-llm-enc-key.py。
  crypto-key: ${TCM_LLM_ENC_KEY:dGNtLWVoci1xYy1kZXYtb25seS1sbG0tZW5jLWtleSE=}

  config-file: D:/ZISHIKU/AI/tcm-ehr-qc/data/llm-config.json   # 非密钥字段持久化（重启回显）；api-key 加密落库，不写本文件

# 操作日志：§七 L2 起只入库（operation_log 表），不再落文件，故无 log.* 配置项。
# ⚠️ 下面的 logging: 是 Spring 应用日志（另一回事），不要一起删。

# 认证（阶段2 §4.4）
auth:
  # 管理员能否看到各组数据。false = 把管理员的 groupId 置空，复用 RecordFilter 的
  # fail-closed → 管理员在任何数据页面都看不到内容。这是设计意图（“数据主权在组”），
  # 收紧时只需改这一行；数据层 / SQL / 前端 / openapi 零改动。
  admin-can-view-data: true

logging:
  level:
    # 排查问题时才改 debug；长期开会让日志迅速变大（且 debug 里可能带业务数据）
    com.tcm.ehr: info
    org.springframework.web: info
