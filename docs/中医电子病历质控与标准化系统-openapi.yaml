      responses:
        '200':
          description: 数据集文件流（CSV为UTF-8、首行为字段名；JSON为数组格式）
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: 质控未通过，禁止导出数据集（code=2001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/governance/clean:
    post:
      tags:
        - 清洗与导出
      summary: 数据清洗规整
      description: 【权限：仅管理员】批量清洗病历数据，完成去重、修复、规整、脏数据隔离【长耗时同步接口（3 万上限）；前端放宽超时、勿重复提交】
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanDTO'
      responses:
        '200':
          description: 清洗完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 清洗完成
                  data:
                    $ref: '#/components/schemas/CleanVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 病历不存在（code=1006）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/qc/score:
    post:
      tags:
        - 质控
      summary: 终末质控评分
      description: 【权限：仅管理员】自动对病历打分、扣分并完成质量分级（合格/待复核/无效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QcScoreDTO'
      responses:
        '200':
          description: 评分与分级
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/QcScoreVO'
        '400':
          description: structuredData 为空（code=2002）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/qc/score/batch:
    post:
      tags:
        - 质控
      summary: 全库质控评分重算
      description: 【权限：仅管理员】对全库病历批量重算质控评分与分级（覆盖现有分数），生成AI预检单（records.qc_results），并对待复核病历自动创建复核任务。【长耗时同步接口（3 万上限 ≤3min）：前端放宽超时、勿重复提交；失败明细仅返回前 50 条示例，完整失败数见 failed】
      responses:
        '200':
          description: 重算完成，返回分级分布
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                      qualified:
                        type: integer
                      pendingReview:
                        type: integer
                      invalid:
                        type: integer
                      failed:
                        type: integer
                        description: 失败条数
                      failureSamples:
                        type: array
                        maxItems: 50
                        description: 失败明细示例（前 50 条），完整失败清单不入库
                        items:
                          type: object
                          properties:
                            recordId:
                              type: integer
                            reason:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/dictionary/import:
    post:
      tags:
        - 词典管理
      summary: 术语库导入
      description: 【权限：仅管理员】上传术语文件（Excel .xlsx/.xls、CSV、JSON），解析校验后写入术语库文件，写入前自动备份旧文件；PDF 请先走 /api/dictionary/convert
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DictionaryImportDTO'
      responses:
        '200':
          description: 导入完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 导入完成
                  data:
                    $ref: '#/components/schemas/DictionaryImportVO'
        '400':
          description: 术语类型非法（code=4001）；行级转换失败在 data.failures 中返回（code=4003，整体仍返回 200）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/dictionary/convert:
    post:
      tags:
        - 词典管理
      summary: 术语库 PDF 智能转换（预览）
      description: 【权限：仅管理员】上传国标 PDF，抽取文本后由 LLM 提取术语候选；不写入术语库，确认后再调 /api/dictionary/import 入库。llm.enabled 或 nlp.convert-enabled 关闭时返回 400
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DictionaryImportDTO'
      responses:
        '200':
          description: 转换完成（仅预览，不落库）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/DictionaryConvertVO'
        '400':
          description: 术语类型非法（code=4001）；或转换未启用 / LLM 不可用 / PDF 未抽到文本（code=400，msg 给出替代路径）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/dictionary/terms:
    get:
      tags:
        - 词典管理
      summary: 术语查询/自动补全
      description: 【权限：登录即可】从内存术语库按类型与关键词过滤，只读查询
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - disease
              - symptom
              - pattern
              - herb
              - formula
        - name: keyword
          in: query
          schema:
            type: string
          description: 名称或别名包含匹配
      responses:
        '200':
          description: 术语列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/DictionaryTermsVO'
        '400':
          description: 术语类型非法（code=4001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/dictionary/rollback:
    post:
      tags:
        - 词典管理
      summary: 术语库版本回滚
      description: 【权限：仅管理员】根据备份文件名将术语库恢复到指定版本，恢复后自动重新加载内存术语库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackDTO'
      responses:
        '200':
          description: 版本恢复成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 版本恢复成功
                  data:
                    type: object
                    nullable: true
        '400':
          description: 术语类型非法（code=4001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 备份文件不存在（code=1006 语义：指定版本不存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/stats:
    post:
      tags:
        - 统计查询
      summary: 数据统计
      description: 【权限：登录即可】按 type 批量统计：disease 疾病频次 / pattern 证候分布 / symptom 症状频次 / prescription 方剂中药频次。上层控制 recordIds 数量上限，接口内部不分页
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatsDTO'
      responses:
        '200':
          description: 统计结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/StatsVO'
        '400':
          description: 参数非法（type 非法或 recordIds 为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/stats/overview:
    get:
      tags:
        - 统计查询
      summary: 看板指标卡
      description: 【权限：登录即可】首页看板四个指标卡数据（病历总数/合格率/待复核数/无效数），一次请求返回，免多次分状态查询
      responses:
        '200':
          description: 指标卡数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/StatsOverviewVO'
              example:
                code: 200
                msg: success
                data:
                  totalRecords: 1234
                  qualifiedCount: 1104
                  qualifiedRate: 89.5
                  pendingReviewCount: 23
                  invalidCount: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/records/search:
    post:
      tags:
        - 病历管理
      summary: 多条件病历查询
      description: 【权限：登录即可】组合条件分页检索病历，返回病历摘要与总数（summary 为原始病历截取片段）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchDTO'
            example:
              registrationNo: ''
              outpatientNo: ''
              gender: ''
              department: ''
              dateRange:
                - '2024-01-01'
                - '2024-12-31'
              pattern: ''
              status: ''
              page: 1
              pageSize: 20
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/SearchVO'
        '400':
          description: 参数非法（分页参数错误等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
