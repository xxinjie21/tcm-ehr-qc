        管理员也只改自己的 —— 配置含三方通道密钥，属个人设置而非系统级设置。
        apiKey 传空串或掩码表示**不修改**（不会清空已存密钥）；密钥经 AES-256-GCM 加密落库，读取只回掩码。
      requestBody:
