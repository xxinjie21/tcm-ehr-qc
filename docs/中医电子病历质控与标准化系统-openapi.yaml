      properties:
                            id:
                              type: string
                            status:
                              type: string
                              description: QUEUED / RUNNING / COMPLETED / CANCELLED / INTERRUPTED / FAILED
                            total:
                              type: integer
                              description: 计划处理条数
                            done:
                              type: integer
                              description: 已处理条数
                            success:
                              type: integer
                            failed:
                              type: integer
                            qualified:
                              type: integer
                              description: 合格数
                            pendingReview:
                              type: integer
                              description: 待复核数
                            invalid:
                              type: integer
                              description: 无效数
                            current:
                              type: string
                              description: 当前处理的病历标识
                            createdBy:
                              type: string
                            createTime:
                              type: string
                              format: date-time
                            startedAt:
                              type: string
                              format: date-time
                            finishedAt:
                              type: string
                              format: date-time
                            failureTruncated:
                              type: boolean
                              description: 失败清单是否被截断（仅存前 500 条）
                            failures:
                              type: array
                              description: 失败明细；列表接口不带，详情接口带
                              items:
                                type: object
                                properties:
                                  recordId:
                                    type: string
                                  reason:
                                    type: string
    QcBatchDTO:
      type: object
      description: 批量质控评分重算请求（入参）；不设 filters = 全库
      properties:
        filters:
          type: object
          description: 数据范围过滤条件（科室 / 时间区间 / 证候 / 分级）；不设条件 = 全部病历
          properties:
            department:
              type: string
            dateRange:
              type: array
              description: '[开始日期, 结束日期]（yyyy-MM-dd）'
              items:
                type: string
            pattern:
              type: string
            grade:
              type: string
              description: 合格 / 待复核 / 无效
        requestKey:
          type: string
          description: 幂等键（可空）；撞 (org_id, request_key) 唯一索引时返回既有任务，不新建也不重跑
    SearchDTO:
      type: object
      description: 多条件查询请求（入参）
      properties:
        registrationNo:
          type: string
          description: 登记号
        outpatientNo:
          type: string
          description: 门诊号
        gender:
          type: string
          description: 性别
        department:
          type: string
          description: 开单科室
        doctorId:
          type: string
          description: 医生工号
        dateRange:
          type: array
          items:
            type: string
            format: date
          description: [开始日期, 结束日期]
        pattern:
          type: string
          description: 辨证结论关键词
        grade:
          type: string
          description: 分级（合格/待复核/无效）
        status:
          type: string
          description: 病历状态，如 invalid 查询无效数据
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          maximum: 200
          example: 20
          description: 每页条数，上限 200（超过返回 400）；与查询参数分页的 500 上限不同，此处刻意更小，防止一次拉全表绕过导出权限
    SearchVO:
      type: object
      description: 查询响应（出参）
      properties:
        total:
          type: integer
        records:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              summary:
                type: string
              grade:
                type: string
                description: 分级（合格/待复核/无效），随查询一并返回，列表页直接展示
              visitTime:
                type: string
                format: date-time
                description: 接诊时间（秒级）。列表展示到日、悬浮展示到秒，故下发完整精度由前端按场景格式化；同时它是列表排序键，避免排序键与所见图列不一致
              gender:
                type: string
                description: 性别，与 age 合成一列展示
              age:
                type: string
                description: 年龄，与 gender 合成一列展示
              score:
                type: integer
                nullable: true
                description: 质控评分（0~100，未质评为 null）。与 grade 成对下发——分级是结论、评分是量值，只给分级看不出差几分
              manuallyEdited:
                type: boolean
                description: 该条结构化数据是否含人工修改（复核提交修正 / PUT 手工改结构化数据时由后端打标）。清洗归一这类自动流程不打，且遇到人工修改过的病历会跳过归一。统计模型抽取准确率时应排除此类数据
    # ========== 术语词典版本管理（批次 17） ==========
    DictProposal:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string, description: "''=基础层" }
        type: { type: string }
        submitUserId: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        auditUserId: { type: string, nullable: true }
        auditComment: { type: string, nullable: true }
        createTime: { type: string, format: date-time }
        auditTime: { type: string, format: date-time, nullable: true }
        purgeAfter: { type: string, format: date-time, nullable: true }
        termCount: { type: integer, description: 快照词条数；快照已清理时为 0 }
        snapshotPresent: { type: boolean, description: 快照是否还在 }

    CreateDictProposal:
      type: object
      required: [type, terms]
      properties:
        type: { type: string, enum: [disease, symptom, pattern, herb, formula, tongue, pulse, treatment] }
        terms:
          type: array
          description: 完整目标词典（非增量 diff）
          items:
            type: object
            properties:
              standardTerm: { type: string }
              code: { type: string }
              source: { type: string }
              aliases:
                type: array
                items: { type: string }

    DictProposalDiff:
      type: object
      properties:
        added:
          type: array
          items: { type: object }
        modified:
          type: array
          items: { type: object }
          description: 含 before（旧值），便于前端显示「从 A 改成 B」
        removed:
          type: array
          items: { type: string }
        noDiff:
          type: boolean
          description: true 表示与基线完全一致
    # ========== NLP 抽取 DTO / VO ==========
    NlpExtractDTO:
      type: object
      description: NLP 抽取请求（入参）
      required:
        - text
      properties:
        text:
          type: string
          description: 待抽取的病历文本
    NlpBatchDTO:
      type: object
      description: 批量解析提交请求（入参）
      properties:
        filters:
          type: object
          description: 筛选范围（与病历查询同口径：科室 / 时间区间 / 证候 / 分级）
          properties:
            department:
              type: string
            dateRange:
              type: array
              items:
                type: string
                format: date
            pattern:
              type: string
            grade:
              type: string
        limit:
          type: integer
          description: 处理条数上限；空或 <=0 表示按筛选范围内全部
    NlpTaskVO:
      type: object
      description: 批量解析任务（出参）
      properties:
        id:
          type: string
        status:
          type: string
          description: QUEUED / RUNNING / COMPLETED / CANCELLED / INTERRUPTED / FAILED
        total:
          type: integer
          description: 计划处理条数
        done:
          type: integer
        success:
          type: integer
        failed:
          type: integer
        current:
          type: string
          description: 当前处理的病历标识
        createdBy:
          type: string
        createTime:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        failureTruncated:
          type: boolean
          description: 失败清单是否被截断（仅保留前 500 条）
        failures:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              reason:
                type: string
    NlpExtractVO:
      type: object
      description: NLP 抽取响应（出参，结构同 StructuredData）
      properties:
        diseases:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        symptoms:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        tongueList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        pulseList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        patternList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        causeList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        treatmentList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        formulaList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        herbs:
          type: array
          items:
            $ref: '#/components/schemas/Herb'
        modelAvailable:
          type: boolean
          description: NLP 服务/模型是否可用；false 表示为降级结果（可能仅规则兜底或为空）
        unavailableReason:
          type: string
          nullable: true
          enum: [DISABLED, SERVICE_UNREACHABLE, MODEL_MISSING]
          description: >-
            降级原因，正常有产出时为 null。DISABLED=抽取总开关未开启（需管理员在服务端开启，页面上无法自助打开）；
            SERVICE_UNREACHABLE=开关已开但抽取服务连不上（未启动 / 中途停止 / 返回非 200 / 调用异常）；
            MODEL_MISSING=服务在跑但模型未加载，本次仅规则兜底（舌象 / 脉象 / 病因 / 治法）。
            前端据此把「为什么没有产出」说准，不再合写成「未开启，或抽取服务暂时不可用」。
    NlpHealthVO:
      type: object
      description: NLP 抽取服务健康探测结果（GET /api/nlp/health）
      properties:
        enabled:
          type: boolean
          description: 抽取总开关（nlp.enabled）；false 时后面的字段均无意义
        reachable:
          type: boolean
          description: Python 抽取服务是否可达（已启用且 /health 返回 200）
        modelAvailable:
          type: boolean
          description: 模型是否加载成功；服务不可达时为 false
        unavailableReason:
          type: string
          nullable: true
          enum: [DISABLED, SERVICE_UNREACHABLE, MODEL_MISSING]
          description: >-
            降级原因，取值与 NlpExtractVO.unavailableReason 同一套；一切正常为 null。
            DISABLED=抽取总开关未开启；SERVICE_UNREACHABLE=服务连不上；MODEL_MISSING=服务在跑但模型未加载。
    # ========== LLM 运行时配置 DTO / VO（UX-68） ==========
    LlmConfigDTO:
      type: object
      description: LLM 配置入参（PUT /api/llm/config 与 POST /api/llm/test 共用）；字段为空表示沿用当前值，apiKey 传空串或掩码表示不修改
      properties:
        enabled:
          type: boolean
          description: 是否启用 LLM；不传沿用当前
        provider:
          type: string
          enum:
            - ollama
            - openai
          description: 通道；ollama 本机免 api-key，openai 指 OpenAI 及兼容三方网关
        baseUrl:
          type: string
          description: 接口地址；留空用通道默认（ollama=http://localhost:11434，openai=https://api.openai.com/v1）
        apiKey:
          type: string
          description: api-key；空串或回传的掩码均表示不修改（明文密钥只在服务端内存中）
        model:
          type: string
          description: 模型名；留空用通道默认模型
        temperature:
          type: number
          format: double
          description: 采样温度，取值 0~2
        timeout:
          type: integer
          description: 单次请求超时（毫秒），取值 1000~300000
    LlmConfigVO:
      type: object
      description: LLM 当前生效配置（出参）；api-key 只回传掩码，明文永不出服务端
      properties:
        enabled:
          type: boolean
          description: 当前是否启用
        provider:
          type: string
          enum:
            - ollama
            - openai
        baseUrl:
          type: string
        apiKeyMask:
          type: string
          description: api-key 掩码（如 sk-****abcd）；未配置为空串
          example: sk-****abcd
        apiKeySet:
          type: boolean
          description: 是否已配置 api-key
        model:
          type: string
        temperature:
          type: number
          format: double
        timeout:
          type: integer
        available:
          type: boolean
          description: 当前是否已按生效配置装配成功（enabled 且参数合法）
    LlmTestVO:
      type: object
      description: LLM 连通性探测结果（出参）
      properties:
        provider:
          type: string
        model:
          type: string
          description: 实际使用的模型名；配置留空时为通道默认模型
        latencyMs:
          type: integer
          format: int64
          description: 往返耗时（毫秒）
        reply:
          type: string
          description: 模型回复内容（探测提示词为 ping，回复通常很短）

    # ========== 清洗与导出 DTO / VO ==========
    NormalizeDTO:
      type: object
      description: 术语标准化请求（入参）
      required:
        - type
        - term
      properties:
        type:
          type: string
          enum:
            - disease
            - symptom
            - pattern
            - herb
            - formula
            - tongue
            - pulse
            - treatment
          description: 术语类型；tongue舌象 / pulse脉象 / treatment治法 自批次 20 起纳入词典
        term:
          type: string
          description: 口语化/非标准术语
    NormalizeVO:
      type: object
      description: 术语标准化响应（出参；未命中时 standardTerm 返回原词、source 返回空字符串、level=0）
      properties:
        standardTerm:
          type: string
          description: 命中的标准术语；未命中时为原词
        source:
          type: string
          description: 归一命中的术语来源（词典名）；未命中为空字符串
        level:
          type: integer
          description: 归一命中层级：1=精确 / 2=包含 / 3=模糊；0=未命中
        code:
          type: string
          description: 国标代码；词典未收录时为 null
    CleanDTO:
      type: object
      description: 数据清洗请求（入参）
      required:
        - recordIds
      properties:
        recordIds:
          type: array
          items:
            type: string
    CleanVO:
      type: object
      description: 清洗结果（出参）
      properties:
        deduped:
          type: integer
        repaired:
          type: integer
        cleared:
          type: integer
        isolated:
          type: integer
        total:
          type: integer
        normalized:
          type: integer
          description: 术语归一命中总数
        normByLevel:
          type: object
          description: 术语归一三级命中分布（精确/包含/模糊）
          properties:
            exact:
              type: integer
            contain:
              type: integer
            fuzzy:
              type: integer
    ExportDatasetDTO:
      type: object
      description: 数据集导出请求（入参）
      properties:
        format:
          type: string
          enum:
            - csv
            - json
          default: csv
        filters:
          type: object
          description: 复用基础查询条件
    # ========== 质控 DTO / VO ==========
    QcCheckDTO:
      type: object
      description: 事前质控检查请求（入参）：只传病历 id，结构化数据由服务端按 id 读取。原先还允许调用方直接传 structuredData 覆盖库里的值，但全仓无调用方使用（前端两处都是 qcScore(recordId)），2026-10-05 收敛为单字段
      properties:
        recordId:
          type: string
          description: 待评分的病历 id
    QcCheckVO:
      type: object
      description: 质控检查响应（出参）
      properties:
        missingFields:
          type: array
          items:
            type: string
        formatErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              msg:
                type: string
        isDuplicate:
          type: boolean
    LogicCheckDTO:
      type: object
      description: 诊疗逻辑一致性检查请求（入参，数组形式）
      properties:
        patternList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        treatmentList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        formulaList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        herbList:
          type: array
          items:
            $ref: '#/components/schemas/Herb'
    LogicCheckVO:
      type: object
      description: 逻辑一致性检查响应（出参）
      properties:
        consistent:
          type: boolean
        conflicts:
          type: array
          items:
            type: string
    QcScoreDTO:
      type: object
      description: 终末质控评分请求（入参）
      properties:
        structuredData:
          $ref: '#/components/schemas/StructuredData'
        qcResults:
          type: object
          description: 事前质控结果
    QcScoreVO:
      type: object
      description: 评分响应（出参；满分100，最低0）。核心要素取自规则集目录，默认 6 项（症状/疾病/证候/舌象/脉象/中药），两档扣分（真缺失 -12 / 漏抽 -6），判定以结构化结果为准；治法、方剂不参与评分
      properties:
        score:
          type: integer
        grade:
          type: string
          enum:
            - 合格
            - 待复核
            - 无效
        structuredMissing:
          type: boolean
          description: structured_data 缺失/解析失败；为 true 时各核心按"漏抽"口径从轻扣分，结果落待复核
        deductions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              item:
                type: string
              points:
                type: integer
              reason:
                type: string
    ReviewTaskVO:
      type: object
      description: 复核任务（出参；超时仅前端高亮提醒，系统不自动变更任务状态）
      properties:
        taskId:
          type: string
        recordId:
          type: string
        status:
          type: string
          enum:
            - 待复核
            - 已完成
        issueType:
          type: string
        score:
          type: integer
        createTime:
          type: string
          format: date-time
          description: 创建时间
        deadlineTime:
          type: string
          format: date-time
          description: 复核截止时间（7 个自然日时限 —— 原写「工作日」有误，2026-10-05 校正，实现按自然日算）
        overdue:
          type: boolean
          description: 是否已超截止时间（计算属性，仅视觉提醒，不自动流转）
    ReviewTasksVO:
      type: object
      description: 复核任务列表（出参）
      properties:
        total:
          type: integer
        skippedMissing:
          type: integer
          description: 因关联病历已删除而跳过的任务数（P5.2）
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ReviewTaskVO'
    ReviewDTO:
      type: object
      description: 人工校正与复核请求（入参；correctedData 允许传 null，代表仅裁定不修改数据）
      properties:
        correctedData:
          anyOf:
            - $ref: '#/components/schemas/StructuredData'
            - nullable: true
        comment:
          type: string
        fingerprint:
          type: string
          description: 读时指纹（批次 25.16）；为空表示不校验，非空且与当前不一致时以 409 拒绝
    ReviewResultVO:
      type: object
      description: 复核结果（出参）
      properties:
        status:
          type: string
          enum:
            - 已完成
            - 待复核
        score:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              msg:
                type: string
