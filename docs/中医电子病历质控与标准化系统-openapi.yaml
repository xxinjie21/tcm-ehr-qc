  /api/dictionary/reindex:
    post:
      tags:
        - 词典管理
      summary: 重建词典索引（可按类型/组织重放）
      description: 【权限：仅管理员】强制重建 ES 索引（不落库、不改词条）。用于「库里词条正确但索引落后」的自愈，不必重启服务。默认只重建<b>当前组织 + 指定类型</b>：基础层与其它组织不连带处理（那会让它们同时进入重建空窗、归一返回 503）；显式传参才做全量重放 —— 那是「索引大面积丢失」时的灾难恢复入口（逐对串行 + 跨实例互斥，单对失败不中断整批，失败项列在 failures）
      parameters:
        - name: type
          in: query
          required: false
          description: 术语类型；省略 = 全部类型
          schema:
            type: string
            enum:
              - disease
              - symptom
              - pattern
              - herb
              - formula
              - tongue
              - pulse
              - treatment
        - name: org
          in: query
          required: false
          description: 组织号；省略 = 当前组织；`*` = 词典里出现过的全部组织
          schema:
            type: string
      responses:
        '200':
          description: 重建完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: herb
                      orgId:
                        type: string
                        description: 所属组织（空串 = 基础层）
                      entries:
                        type: integer
                        example: 120
                      version:
                        type: string
                        example: 3f2a1c9d8b7e6051
        '400':
          description: 术语类型非法

        '409':
          description: 该「类型+组织」的 ES 重建正由另一实例进行（跨实例互斥未拿到锁）：单对重放会跳过该对并列入 failures，其它对继续处理（code=409）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'
