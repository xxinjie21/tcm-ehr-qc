        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/orgs:
    get:
      tags:
        - 组织
      summary: 组织列表
      description: 【权限：仅管理员】可带 status 筛选
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - stopped
              - archived
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - 组织
      summary: 自助创建组织
      description: 【权限：登录即可】创建者自动成为该组织所有者；无审核。服务端有三道防滥用闸（每人最多 3 个未归档组织、编码白名单、名下名称去重）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: 组织名称
                code:
                  type: string
                  description: 组织编码，可留空由服务端生成；大写字母/数字/连字符，2~50 位
                purpose:
                  type: string
                  maxLength: 500
                  description: 用途说明（可选）
      responses:
        '200':
          description: 已创建，返回组织概要
        '400':
          description: 名称为空 / 编码非法 / 编码被占用 / 超出创建配额 / 名下已有同名组织
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
