        - 质控
      summary: 查询质控批量重算任务进度
      description: "【权限：登录即可】返回进度与分级汇总（qualified / pendingReview / invalid），含失败明细。前端 2s 轮询本接口直到 status 进入终态。数据域：任务不属于当前组织时返回 404（不区分「不存在」与「无权查看」）。"
      parameters:
        - name: id
          in: path
          required: true
          description: 任务ID
          schema:
            type: string
      responses:
        '200':
          description: 任务进度与分级汇总
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                  data:
                      id:
                        type: string
                      status:
                        type: string
                        description: QUEUED / RUNNING / COMPLETED / CANCELLED / INTERRUPTED / FAILED
                      total:
                        type: integer
                        description: 计划处理条数
                      done:
                        type: integer
                        description: 已处理条数
                      success:
                        type: integer
                      failed:
                        type: integer
                      qualified:
                        type: integer
                        description: 合格数
                      pendingReview:
                        type: integer
                        description: 待复核数
                      invalid:
                        type: integer
                        description: 无效数
                      current:
                        type: string
                        description: 当前处理的病历标识
                      createdBy:
                        type: string
                      createTime:
                        type: string
                        format: date-time
                      startedAt:
                        type: string
                        format: date-time
                      finishedAt:
                        type: string
                        format: date-time
                      failureTruncated:
                        type: boolean
                        description: 失败清单是否被截断（仅存前 500 条）
                      failures:
                        type: array
                        description: 失败明细；列表接口不带，详情接口带
                        items:
                          type: object
                          properties:
                            recordId:
                              type: string
                            reason:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
  /api/qc/score/batch/{id}/cancel:
    post:
      tags:
        - 质控
      summary: 取消质控批量重算任务
      description: "【权限：登录即可】排队中的任务直接置为已取消；运行中的置取消位，由 worker 在分页边界退出并落库。数据域：任务不属于当前组织时返回 403（写操作按「不许」报，不按「不存在」）。"
      parameters:
        - name: id
          in: path
          required: true
          description: 任务ID
          schema:
            type: string
      responses:
        '200':
          description: 取消后的任务状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                  data:
                      id:
                        type: string
                      status:
                        type: string
                        description: QUEUED / RUNNING / COMPLETED / CANCELLED / INTERRUPTED / FAILED
                      total:
                        type: integer
                        description: 计划处理条数
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 任务不属于当前组织
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '404':
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
  /api/qc/rules:
    get:
      tags:
        - 质控
      summary: 读取质控规则
      description: 【权限：登录即可】返回<b>当前组织</b>生效的质控规则集（该组织无自定义时回退内置默认）、自然语言描述与目录，以及加载告警；规则依赖的要素缺失时判定为"不适用"
      responses:
        '200':
          description: 规则集 {rules, descriptions, consistencySummary, catalogElements, catalogFormats, warnings}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      rules:
                        type: object
                      descriptions:
                        type: array
                        description: 自然语言描述（与规则同源）
                        items:
                          type: string
                      catalogElements:
                        type: array
                        description: 可选要素目录（中文名 ↔ 结构化 key/回退列）
                        items:
                          type: object
                      catalogFormats:
                        type: array
                        description: 格式模板目录
                        items:
                          type: object
                      consistencySummary:
                        type: string
                        description: 一致性规则构成摘要，如「14 条（中药 9 / 方剂 5）」；由规则数据拼装下发，前端不写死
                      warnings:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - 质控
      summary: 保存质控规则
      description: 【权限：管理员 / 所有者 / 授权成员】保存<b>当前组织</b>的质控规则（写入 qc_rules 表，立即生效；其他组织不受影响）。缺失字段以默认补齐，关键项非法回默认并告警
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: QcRuleSet（completeness / format / consistency / standardization / duplicateWeight / thresholds）
      responses:
        '200':
          description: 保存后的规则集
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/qc/rules/reset:
    post:
      tags:
        - 质控
      summary: 恢复默认质控规则
      description: 【权限：管理员 / 所有者 / 授权成员】恢复<b>当前组织</b>的内置默认质控规则
      responses:
        '200':
          description: 默认规则集
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/qc/deduction-stats:
    get:
      tags:
        - 质控
      summary: 范围扣分维度聚合
      description: 【权限：登录即可】按范围（filters：department/start/end/pattern/grade）聚合各病历扣分明细：按维度（byType）与明细项（byItem）汇总次数/扣分，另附分级分布；优先读 records.qc_results，缺失则现算，扫描上限超出时 truncated=true
      parameters:
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: pattern
          in: query
          required: false
          schema:
            type: string
        - name: grade
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 扣分聚合
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      scanned:
                        type: integer
                      truncated:
                        type: boolean
                      totalPoints:
                        type: integer
                      byType:
                        type: array
                        items:
                          type: object
                      byItem:
                        type: array
                        items:
                          type: object
                      gradeDist:
                        type: object
                      itemsTruncated:
                        type: boolean
                        description: 明细是否被截断（仅保留按分值降序前 20 条）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/dictionary/import:
    post:
      tags:
        - 词典管理
      summary: 术语库导入
      description: 【权限：管理员 / 所有者 / 授权成员】上传术语文件（Excel .xlsx/.xls、CSV、JSON），解析校验后写入术语库，写入前自动备份旧文件。组织层（缺省或 target=org）走三档门槛并生成归档版本；target=base 写基础层，影响所有组织，仍限管理员
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DictionaryImportDTO'
      responses:
        '200':
          description: 导入完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 导入完成
                  data:
                    $ref: '#/components/schemas/DictionaryImportVO'
        '400':
          description: 术语类型非法（code=4001）；行级转换失败在 data.failures 中返回（code=4003，整体仍返回 200）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          description: 同一「类型+组织」的词典重建正在进行（由另一实例持锁）。本次导入已把库内容退回导入前、ES 未被改动（code=409），稍后重试即可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
  /api/dictionary/terms:
    get:
      tags:
        - 词典管理
      summary: 术语查询/自动补全
      description: 【权限：登录即可】从内存术语库按类型与关键词过滤，只读查询
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - disease
              - symptom
              - pattern
              - herb
              - formula
              - tongue
              - pulse
              - treatment
        - name: keyword
          in: query
          schema:
            type: string
          description: 名称或别名包含匹配，为空表示不过滤
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: 页码（从 1 开始）。不传或传 0 = 不分页、返回全部命中（供输入联想与规则下拉取完整候选）；传页码 = 分页（供术语词典页翻页）。页码超出总页数返回空列表而非报错
        - name: size
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
          description: 每页条数，仅 page>0 时生效
      responses:
        '200':
          description: 术语列表（分页时为本页；不分页时为全部命中）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/DictionaryTermsVO'
        '400':
          description: 术语类型非法（code=4001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/dictionary/baseline/export:
    get:
      tags:
        - 词典管理
      summary: 导出小组基线（全量）
      description: 【权限：登录即可】导出当前组织该类型的完整基线词条，供前端存为本地个人词典。本地修改不会自动同步回小组基线，必须走提案流程
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [disease, symptom, pattern, herb, formula, tongue, pulse, treatment]
      responses:
        '200':
          description: 基线词条数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        standardTerm:
                          type: string
                        code:
                          type: string
                        source:
                          type: string
                        aliases:
                          type: array
                          items:
                            type: string
  /api/dictionary/proposals:
    get:
      tags:
        - 词典管理
      summary: 提案列表
      description: 【权限：登录即可】普通成员只看到自己提交的提案；组织所有者看到本组织提案与基础层提案。查询时顺带惰性清理已驳回且过期的提案快照（提案主记录永久保留）。type 可选，用于跟随词典页的类型筛选；省略则返回全部类型
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: type
          in: query
          required: false
          description: 术语类型；非法值按 4001 拒绝，与 /import、/archives 同一口径
          schema:
            type: string
            enum: [disease, symptom, pattern, herb, formula, tongue, pulse, treatment]
      responses:
        '200':
          description: 提案列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DictProposal'
    post:
      tags:
        - 词典管理
      summary: 提交基线更新提案
      description: 【权限：登录即可】提交一份完整的目标词典（不是增量 diff），生成待审提案。同一组织同一类型最多同时存在 5 条待审提案，超出直接拒绝
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDictProposal'
      responses:
        '200':
          description: 已生成提案，等待组长审核
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/DictProposal'
  /api/dictionary/parse:
    post:
      tags:
        - 词典管理
      summary: 上传词典文件解析为词条（不落库）
      description: 【权限：登录即可】普通成员的「批量导入词典」入口。只把文件解析成词条列表返回，<b>不写任何后端数据</b>；前端据此把词条并入本机个人词典（localStorage）。成员若想把词表推广给小组，再到「我的词典」提交提案，由组长审核合并。Excel 需服务端 POI 解析，故放在服务端。响应附带 lint 词表体检结果：同名重复、别名含标准词、编码形态异常等都是导入不会报错的缺陷，只在入库前指出
      parameters:
        - name: file
          in: query
          required: true
          description: 词典文件（.xlsx/.xls/.csv/.json），首列「标准术语」不能为空
          schema:
            type: string
            format: binary
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [disease, symptom, pattern, herb, formula, tongue, pulse, treatment]
      responses:
        '200':
          description: 解析结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 操作成功
                  data:
                    type: object
                    properties:
                      terms:
                        type: array
                        items:
                          type: object
                          properties:
                            standardTerm:
                              type: string
                            code:
                              type: string
                            source:
                              type: string
                            aliases:
                              type: array
                              items:
                                type: string
                      failures:
                        type: array
                        items:
                          type: object
                          properties:
                            row:
                              type: integer
                            reason:
                              type: string
                      lint:
                        $ref: '#/components/schemas/DictionaryLint'
  /api/dictionary/proposals/{id}/diff:
    get:
      tags:
        - 词典管理
      summary: 提案与基线的差异
      description: 【权限：登录即可】实时对比提案快照与当前基线，给出新增/修改/删除三组；差异不落表。仅提交者本人与组织所有者可查看
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 差异视图
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/DictProposalDiff'
        '400':
          description: 提案不存在
        '403':
          description: 无权查看该提案（仅提交者本人与组织所有者可看）
  /api/dictionary/proposals/{id}/terms:
    put:
      tags:
        - 词典管理
      summary: 在线编辑提案内容
      description: 【权限：登录即可】修改仅作用于本次提案，不改动小组基线。服务端强制校验「操作人＝提交者本人」，且仅待审提案可编辑
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                terms:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: 提案内容已更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
  /api/dictionary/proposals/{id}/audit:
    post:
      tags:
        - 词典管理
      summary: 审核提案
      description: 【权限：管理员 / 所有者 / 授权成员】通过则整快照替换基线、重建该组织 ES 索引并生成归档版本；拒绝则填理由作废，快照 7 天后惰性清理（主记录永久保留）。已审核过的提案不能重复审核。归属不按路径判定（{id} 是提案号），改由服务端按提案自身的 org_id 判定：管理员可审任意提案（含基础层），组织所有者只能审本组织的提案
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve:
                  type: boolean
                comment:
                  type: string
      responses:
        '200':
          description: 审核完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/DictProposal'
        '409':
          description: 该「类型+组织」的合并重建正由另一实例进行（跨实例互斥未拿到锁），提案状态未变，稍后重试（code=409）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
  /api/dictionary/archives:
    get:
      tags:
        - 词典管理
      summary: 归档版本列表
      description: 【权限：登录即可】每组织每类型最多保留最近 5 份归档快照；版本元信息永久保留。快照被清理的版本仍会列出（snapshotPresent=false）但不能再回滚
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [disease, symptom, pattern, herb, formula, tongue, pulse, treatment]
      responses:
        '200':
          description: 归档版本列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        orgId:
                          type: string
                        type:
                          type: string
                        versionNo:
                          type: integer
                        proposalId:
                          type: string
                          nullable: true
                        mergeTime:
                          type: string
                          format: date-time
                        mergeUserId:
                          type: string
                        comment:
                          type: string
                        snapshotPresent:
                          type: boolean
                        termCount:
                          type: integer
  /api/dictionary/archives/{versionNo}/rollback:
    post:
      tags:
        - 词典管理
      summary: 基于归档版本生成回滚提案
      description: 【权限：管理员 / 所有者 / 授权成员】读取该版本快照自动生成一份<b>新提案</b>，仍需走审核流程后才会合并（不直接还原基线，避免绕过审核）。回滚完成后同样生成新的归档版本并计入 5 份限额
      parameters:
        - name: versionNo
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [disease, symptom, pattern, herb, formula, tongue, pulse, treatment]
      responses:
        '200':
          description: 已生成回滚提案
          content:
