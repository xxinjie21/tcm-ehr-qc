      description: 【权限：登录即可】按筛选范围提交后台批量解析任务，立即返回 taskId。任务由服务端固定并发（默认 2）的队列执行，进度与失败清单持久化在 nlp_task 表，可关闭页面后回来查看。每条处理：拼文本→抽取→ES 术语归一→打词典版本→写 structured_data
