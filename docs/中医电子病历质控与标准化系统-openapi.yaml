      summary: 按用户名搜索可拉入的用户
      description: 【权限：登录即可】关键词至少 2 个字符，最多返回 20 条；只返回 id 与 username（不返回角色/状态/所属组织，防枚举）
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          description: 用户名关键字，至少 2 个字符
      responses:
        '200':
          description: OK
        '400':
          description: 关键词不足 2 个字符
        '401':
