openapi: 3.0.3
info:
  title: 中医电子病历质控与标准化系统
  description: |
    中医电子病历质控与标准化系统接口文档。

    ## 权限约定
    接口分四档权限，各接口在 description 首部以【权限：…】标注：
    - **仅管理员**：管理类操作（词典导入/回滚、数据清洗、数据集导出、日志审计、质控评分与重算）。
    - **登录即可**：只读查询与业务计算（术语查询/归一、统计看板、NLP 抽取、原始病历查看）。
    - **管理员 / 审核员**：复核相关接口（复核任务列表、提交复核）。
    - **公开**：用户登录、用户注册。
    审核员另受**数据域（行级权限）**约束：仅可读取 grade='待复核' 的病历；管理员为全库。
    执行顺序固定为「先数据域、后用户筛选」取交集，用户筛选条件不得绕过数据域。
    权限不足统一返回 HTTP 403（code=403）。
    ## 实体分层命名约定
    - **DTO**（后缀 DTO）：请求体入参模型，接口入参统一使用。
    - **VO**（后缀 VO）：响应体出参模型，接口出参统一使用。
    - **PO**（后缀 PO）：数据库持久层实体，内部使用，不暴露于接口，故本文档不列出。
    - **共享模型**（无后缀）：跨请求/响应复用的数据模型（如 StructuredData、Entity、Herb、RecordMetadata），见数据模型定义。
    ## 接口通用约定
    除标注「文件流下载」的接口外，所有接口统一返回 Result 包装 {"code":200,"msg":"string","data":any}。
    - code: 200成功；400参数非法；401未登录/token失效；403权限不足；404资源不存在；500服务异常。
    - 登录态：非登录接口需在请求头携带 Authorization: Bearer <token>。
    - 实体识别无结果统一返回空数组 []，禁止返回 null。
    - 分页统一参数：page（从1开始）、pageSize。
    - 错误响应统一结构见 ErrorVO（code/msg/data，非 200 时 data 为 null）。
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: 认证
    description: 用户登录鉴权
  - name: 病历管理
    description: 病历导入、新增、查看、修改、删除、查询
  - name: NLP抽取
    description: 中医四诊实体抽取
  - name: 清洗与导出
    description: 术语标准化、数据清洗规整、数据集导出
  - name: 质控
    description: 事前质控、诊疗逻辑校验、终末评分
  - name: 复核
    description: 人工校正与复核
  - name: 词典管理
    description: 术语库导入、查询、回滚
  - name: 统计查询
    description: 症状频次/证候分布/方剂中药频次
  - name: 日志
    description: 操作日志导出
  - name: AI助手
    description: AI 质控解读与业务问答（规则出结论 + LLM 叙述，LLM 不可用降级）
  - name: LLM配置
    description: 运行时 LLM 通道配置（ollama / openai 兼容），保存即生效
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未登录或 token 缺失/过期（code=401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorVO'
    Forbidden:
      description: 权限不足（code=403）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorVO'
    ServerError:
      description: 服务异常（code=500）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorVO'
  schemas:
    # ========== 通用响应包装（VO） ==========
    ResultVO:
      type: object
      description: 统一响应包装（出参）
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data:
          nullable: true
    ErrorVO:
      type: object
      description: 统一错误响应（出参；非 200 时 data 为 null）
      properties:
        code:
          type: integer
          description: 错误码：400/401/403/404/500 及业务错误码
        msg:
          type: string
          description: 错误描述
        data:
          type: object
          nullable: true
          example: null
    # ========== 共享数据模型（跨请求/响应复用，非 PO） ==========
    Entity:
      type: object
      description: 实体（含内容与原文片段），共享模型
      properties:
        content:
          type: string
          description: 标准表述
        sourceText:
          type: string
          description: 原文片段
        confidence:
          type: number
          format: double
          description: 置信度（0~1）；模型实体提供，规则兜底可省
        source:
          type: string
          description: 来源：model（NER 模型）/ rule（规则兜底）
          enum:
            - model
            - rule
        normLevel:
          type: integer
          description: 归一命中层级：1=精确 / 2=包含 / 3=模糊；未归一或未命中词典时不返回
        normSource:
          type: string
          description: 归一命中的术语来源（词典名）；未命中不返回
        normCode:
          type: string
          description: 国标代码；词典未收录时不返回
    Herb:
      type: object
      description: 中药实体（含剂量），共享模型
      properties:
        name:
          type: string
          description: 中药名称
        dosage:
          type: string
          description: 剂量，如 15g
        sourceText:
          type: string
          description: 原文片段
        confidence:
          type: number
          format: double
          description: 置信度（0~1）；模型实体提供，规则兜底可省
        source:
          type: string
          description: 来源：model（NER 模型）/ rule（规则兜底）
          enum:
            - model
            - rule
        normLevel:
          type: integer
          description: 归一命中层级：1=精确 / 2=包含 / 3=模糊；未归一或未命中词典时不返回
        normSource:
          type: string
          description: 归一命中的术语来源（词典名）；未命中不返回
        normCode:
          type: string
          description: 国标代码；词典未收录时不返回
    RecordMetadata:
      type: object
      description: 病历元数据（共享模型）
      properties:
        visitDate:
          type: string
          format: date
          example: '2024-11-20'
        department:
          type: string
          example: 内科
        tags:
          type: array
          items:
            type: string
          example:
            - 门诊
    StructuredData:
      type: object
      description: 结构化病历数据模型（共享模型：NLP 提取结果出参 / 质控评分与复核入参复用；未识别实体返回空数组 []）
      properties:
        diseases:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        symptoms:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        tongueList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        pulseList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        patternList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        causeList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        treatmentList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        formulaList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        herbs:
          type: array
          items:
            $ref: '#/components/schemas/Herb'
    # ========== 认证 DTO / VO ==========
    LoginDTO:
      type: object
      description: 登录请求（入参）
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginVO:
      type: object
      description: 登录响应（出参）
      properties:
        token:
          type: string
        role:
          type: string
          description: 管理员 / 审核员
        menus:
          type: array
          items:
            type: string
          example:
            - 首页看板
            - 病历数据
            - 结构化解析
            - 质控校验
            - 人工复核
            - 清洗与导出
            - 术语词典
            - 日志审计
    # ========== 病历管理 DTO / VO ==========
    ImportSummaryVO:
      type: object
      description: 导入摘要（出参）
      properties:
        total:
          type: integer
        success:
          type: integer
        failed:
          type: integer
        failures:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              reason:
                type: string
    ImportTaskVO:
      type: object
      description: 导入任务（出参）
      properties:
        taskId:
          type: string
        summary:
          $ref: '#/components/schemas/ImportSummaryVO'
    ImportStatusVO:
      type: object
      description: 导入进度（出参）
      properties:
        taskId:
          type: string
        status:
          type: string
          enum:
            - 处理中
            - 已完成
        total:
          type: integer
          description: 有效数据行总数
        processed:
          type: integer
          description: 已处理行数
        success:
          type: integer
          description: 成功入库数
        failed:
          type: integer
          description: 失败数
        failures:
          type: array
          description: 失败明细（文件名 + 原因）
          items:
            type: object
            properties:
              filename:
                type: string
              reason:
                type: string
    CreateRecordDTO:
      type: object
      description: 单条新增病历请求（入参，21个字段）
      required:
        - registrationNo
        - outpatientNo
      properties:
        registrationNo:
          type: string
          description: 登记号
        outpatientNo:
          type: string
          description: 门诊号
        gender:
          type: string
          description: 性别
        age:
          type: string
          description: 年龄
        visitCount:
          type: integer
          description: 就诊次数
        westernDiagnosis:
          type: string
          description: 西医诊断
        tcmDiagnosis:
          type: string
          description: 中医诊断
        presentIllness:
          type: string
          description: 现病史
        chiefComplaint:
          type: string
          description: 主诉
        selfReport:
          type: string
          description: 自诉
        inspection:
          type: string
          description: 望诊
        pulse:
          type: string
          description: 脉诊
        tongue:
          type: string
          description: 舌诊
        physicalExam:
          type: string
          description: 查体
        pattern:
          type: string
          description: 辨证结论
        prescription:
          type: string
          description: 草药
        followUp:
          type: string
          description: 随访
        treatmentEffect:
          type: string
          description: 治疗效果
        department:
          type: string
          description: 开单科室
        doctorId:
          type: string
          description: 医生工号
        visitTime:
          type: string
          format: date-time
          description: 接诊时间
    CreateRecordVO:
      type: object
      description: 新增病历响应（出参）
      properties:
        id:
          type: string
    RawRecordVO:
      type: object
      description: 原始病历查看响应（出参，21个字段）
      properties:
        id:
          type: string
        registrationNo:
          type: string
          description: 登记号
        outpatientNo:
          type: string
          description: 门诊号
        gender:
          type: string
          description: 性别
        age:
          type: string
          description: 年龄
        visitCount:
          type: integer
          description: 就诊次数
        westernDiagnosis:
          type: string
          description: 西医诊断
        tcmDiagnosis:
          type: string
          description: 中医诊断
        presentIllness:
          type: string
          description: 现病史
        chiefComplaint:
          type: string
          description: 主诉
        selfReport:
          type: string
          description: 自诉
        inspection:
          type: string
          description: 望诊
        pulse:
          type: string
          description: 脉诊
        tongue:
          type: string
          description: 舌诊
        physicalExam:
          type: string
          description: 查体
        pattern:
          type: string
          description: 辨证结论
        prescription:
          type: string
          description: 草药
        followUp:
          type: string
          description: 随访
        treatmentEffect:
          type: string
          description: 治疗效果
        department:
          type: string
          description: 开单科室
        doctorId:
          type: string
          description: 医生工号
        visitTime:
          type: string
          format: date-time
          description: 接诊时间
    UpdateRecordDTO:
      type: object
      description: 修改病历请求（入参，仅结构化数据，原始字段不可修改）
      properties:
        structuredData:
          $ref: '#/components/schemas/StructuredData'
    DeleteRecordsDTO:
      type: object
      description: 批量删除请求（入参）
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
    DeleteRecordsVO:
      type: object
      description: 删除响应（出参）
      properties:
        deletedCount:
          type: integer
    OperationLogVO:
      type: object
      description: 操作日志（出参，operation_log 表字段）
      properties:
        id:
          type: string
        logTime:
          type: string
          format: date-time
          description: 操作时间
        operator:
          type: string
          description: 操作人用户名
        role:
          type: string
          description: 操作人角色
        action:
          type: string
          description: 操作类型
        target:
          type: string
          description: 操作对象
        detail:
          type: string
          description: 操作明细
        ip:
          type: string
    SearchDTO:
      type: object
      description: 多条件查询请求（入参）
      properties:
        registrationNo:
          type: string
          description: 登记号
        outpatientNo:
          type: string
          description: 门诊号
        gender:
          type: string
          description: 性别
        department:
          type: string
          description: 开单科室
        doctorId:
          type: string
          description: 医生工号
        dateRange:
          type: array
          items:
            type: string
            format: date
          description: [开始日期, 结束日期]
        pattern:
          type: string
          description: 辨证结论关键词
        grade:
          type: string
          description: 分级（合格/待复核/无效）
        status:
          type: string
          description: 病历状态，如 invalid 查询无效数据
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
    SearchVO:
      type: object
      description: 查询响应（出参）
      properties:
        total:
          type: integer
        records:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              summary:
                type: string
              grade:
                type: string
                description: 分级（合格/待复核/无效），随查询一并返回，列表页直接展示
              visitTime:
                type: string
                format: date-time
                description: 接诊时间（秒级）。列表展示到日、悬浮展示到秒，故下发完整精度由前端按场景格式化；同时它是列表排序键，避免排序键与所见图列不一致
              gender:
                type: string
                description: 性别，与 age 合成一列展示
              age:
                type: string
                description: 年龄，与 gender 合成一列展示
    # ========== NLP 抽取 DTO / VO ==========
    NlpExtractDTO:
      type: object
      description: NLP 抽取请求（入参）
      required:
        - text
      properties:
        text:
          type: string
          description: 待抽取的病历文本
    NlpBatchDTO:
      type: object
      description: 批量解析提交请求（入参）
      properties:
        filters:
          type: object
          description: 筛选范围（与病历查询同口径：科室 / 时间区间 / 证候 / 分级）
          properties:
            department:
              type: string
            dateRange:
              type: array
              items:
                type: string
                format: date
            pattern:
              type: string
            grade:
              type: string
        limit:
          type: integer
          description: 处理条数上限；空或 <=0 表示按筛选范围内全部
    NlpTaskVO:
      type: object
      description: 批量解析任务（出参）
      properties:
        id:
          type: string
        status:
          type: string
          description: QUEUED / RUNNING / COMPLETED / CANCELLED / INTERRUPTED / FAILED
        total:
          type: integer
          description: 计划处理条数
        done:
          type: integer
        success:
          type: integer
        failed:
          type: integer
        current:
          type: string
          description: 当前处理的病历标识
        createdBy:
          type: string
        createTime:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        failureTruncated:
          type: boolean
          description: 失败清单是否被截断（仅保留前 500 条）
        failures:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              reason:
                type: string
    NlpExtractVO:
      type: object
      description: NLP 抽取响应（出参，结构同 StructuredData）
      properties:
        diseases:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        symptoms:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        tongueList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        pulseList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        patternList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        causeList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        treatmentList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        formulaList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        herbs:
          type: array
          items:
            $ref: '#/components/schemas/Herb'
        modelAvailable:
          type: boolean
          description: NLP 服务/模型是否可用；false 表示为降级结果（可能仅规则兜底或为空）
        unavailableReason:
          type: string
          nullable: true
          enum: [DISABLED, SERVICE_UNREACHABLE, MODEL_MISSING]
          description: >-
            降级原因，正常有产出时为 null。DISABLED=抽取总开关未开启（需管理员在服务端开启，页面上无法自助打开）；
            SERVICE_UNREACHABLE=开关已开但抽取服务连不上（未启动 / 中途停止 / 返回非 200 / 调用异常）；
            MODEL_MISSING=服务在跑但模型未加载，本次仅规则兜底（舌象 / 脉象 / 病因 / 治法）。
            前端据此把「为什么没有产出」说准，不再合写成「未开启，或抽取服务暂时不可用」。
    # ========== LLM 运行时配置 DTO / VO（UX-68） ==========
    LlmConfigDTO:
      type: object
      description: LLM 配置入参（PUT /api/llm/config 与 POST /api/llm/test 共用）；字段为空表示沿用当前值，apiKey 传空串或掩码表示不修改
      properties:
        enabled:
          type: boolean
          description: 是否启用 LLM；不传沿用当前
        provider:
          type: string
          enum:
            - ollama
            - openai
          description: 通道；ollama 本机免 api-key，openai 指 OpenAI 及兼容三方网关
        baseUrl:
          type: string
          description: 接口地址；留空用通道默认（ollama=http://localhost:11434，openai=https://api.openai.com/v1）
        apiKey:
          type: string
          description: api-key；空串或回传的掩码均表示不修改（明文密钥只在服务端内存中）
        model:
          type: string
          description: 模型名；留空用通道默认模型
        temperature:
          type: number
          format: double
          description: 采样温度，取值 0~2
        timeout:
          type: integer
          description: 单次请求超时（毫秒），取值 1000~300000
    LlmConfigVO:
      type: object
      description: LLM 当前生效配置（出参）；api-key 只回传掩码，明文永不出服务端
      properties:
        enabled:
          type: boolean
          description: 当前是否启用
        provider:
          type: string
          enum:
            - ollama
            - openai
        baseUrl:
          type: string
        apiKeyMask:
          type: string
          description: api-key 掩码（如 sk-****abcd）；未配置为空串
          example: sk-****abcd
        apiKeySet:
          type: boolean
          description: 是否已配置 api-key
        model:
          type: string
        temperature:
          type: number
          format: double
        timeout:
          type: integer
        available:
          type: boolean
          description: 当前是否已按生效配置装配成功（enabled 且参数合法）
    LlmTestVO:
      type: object
      description: LLM 连通性探测结果（出参）
      properties:
        provider:
          type: string
        model:
          type: string
          description: 实际使用的模型名；配置留空时为通道默认模型
        latencyMs:
          type: integer
          format: int64
          description: 往返耗时（毫秒）
        reply:
          type: string
          description: 模型回复内容（探测提示词为 ping，回复通常很短）

    # ========== 清洗与导出 DTO / VO ==========
    NormalizeDTO:
      type: object
      description: 术语标准化请求（入参）
      required:
        - type
        - term
      properties:
        type:
          type: string
          enum:
            - disease
            - symptom
            - pattern
            - herb
            - formula
          description: disease疾病 / pattern证候 / symptom症状 / herb中药 / formula方剂
        term:
          type: string
          description: 口语化/非标准术语
    NormalizeVO:
      type: object
      description: 术语标准化响应（出参；未命中时 standardTerm 返回原词、source 返回空字符串、level=0）
      properties:
        standardTerm:
          type: string
          description: 命中的标准术语；未命中时为原词
        source:
          type: string
          description: 归一命中的术语来源（词典名）；未命中为空字符串
        level:
          type: integer
          description: 归一命中层级：1=精确 / 2=包含 / 3=模糊；0=未命中
        code:
          type: string
          description: 国标代码；词典未收录时为 null
    CleanDTO:
      type: object
      description: 数据清洗请求（入参）
      required:
        - recordIds
      properties:
        recordIds:
          type: array
          items:
            type: string
    CleanVO:
      type: object
      description: 清洗结果（出参）
      properties:
        deduped:
          type: integer
        repaired:
          type: integer
        cleared:
          type: integer
        isolated:
          type: integer
        total:
          type: integer
        normalized:
          type: integer
          description: 术语归一命中总数
        normByLevel:
          type: object
          description: 术语归一三级命中分布（精确/包含/模糊）
          properties:
            exact:
              type: integer
            contain:
              type: integer
            fuzzy:
              type: integer
    ExportDatasetDTO:
      type: object
      description: 数据集导出请求（入参）
      properties:
        format:
          type: string
          enum:
            - csv
            - json
          default: csv
        filters:
          type: object
          description: 复用基础查询条件
    # ========== 质控 DTO / VO ==========
    QcCheckDTO:
      type: object
      description: 事前质控检查请求（入参）
      properties:
        structuredData:
          $ref: '#/components/schemas/StructuredData'
    QcCheckVO:
      type: object
      description: 质控检查响应（出参）
      properties:
        missingFields:
          type: array
          items:
            type: string
        formatErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              msg:
                type: string
        isDuplicate:
          type: boolean
    LogicCheckDTO:
      type: object
      description: 诊疗逻辑一致性检查请求（入参，数组形式）
      properties:
        patternList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        treatmentList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        formulaList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        herbList:
          type: array
          items:
            $ref: '#/components/schemas/Herb'
    LogicCheckVO:
      type: object
      description: 逻辑一致性检查响应（出参）
      properties:
        consistent:
          type: boolean
        conflicts:
          type: array
          items:
            type: string
    QcScoreDTO:
      type: object
      description: 终末质控评分请求（入参）
      properties:
        structuredData:
          $ref: '#/components/schemas/StructuredData'
        qcResults:
          type: object
          description: 事前质控结果
    QcScoreVO:
      type: object
      description: 评分响应（出参；满分100，最低0）。核心要素 5 项（症状/证候/舌象/脉象/中药），判定以结构化结果为准；治法、方剂不参与评分
      properties:
        score:
          type: integer
        grade:
          type: string
          enum:
            - 合格
            - 待复核
            - 无效
        structuredMissing:
          type: boolean
          description: structured_data 缺失/解析失败；为 true 时各核心按"漏抽"口径从轻扣分，结果落待复核
        deductions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              item:
                type: string
              points:
                type: integer
              reason:
                type: string
    GraphVO:
      type: object
      description: 质控检验图谱（出参，节点=病历+实体、边=关联/规则/冲突；前端以「冲突清单 + 规则命中对照 + 覆盖说明」表格呈现，2026-09-23 起不再画力导向图）
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
                description: 病历摘要或实体标准词
              type:
                type: string
                description: record / disease / pattern / symptom / tongue / pulse / formula / herb / cause / treatment
              size:
                type: integer
                description: 病历=1；实体=频次
        edges:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              target:
                type: string
              type:
                type: string
                description: rel（病历-实体关联）/ rule（证候-治法/方剂规则）/ conflict（冲突，红色虚线）
              label:
                type: string
                description: 冲突原因（type=conflict 时）
        truncated:
          type: boolean
          description: 是否因节点/边上限被截断
        hint:
          type: string
          description: 截断提示文案
        counts:
          type: object
          description: 各类节点计数（图例/统计）
          properties:
            record:
              type: integer
            disease:
              type: integer
            symptom:
              type: integer
            tongue:
              type: integer
            pulse:
              type: integer
            pattern:
              type: integer
            cause:
              type: integer
            treatment:
              type: integer
            formula:
              type: integer
            herb:
              type: integer
        coveredPatterns:
          type: array
          items:
            type: string
          description: >-
            本次聚合范围内被规则表覆盖到的证候名（可能为空）。规则表只覆盖少数常见证候，
            未覆盖的证候按设计不判冲突（不误杀）；若该数组为空，则 edges 中必然没有
            rule / conflict 边，前端应据此把文案从「证候与治法一致」改为「无可判规则」。
    # ========== 复核 DTO / VO ==========
    ReviewTaskVO:
      type: object
      description: 复核任务（出参；超时仅前端高亮提醒，系统不自动变更任务状态）
      properties:
        taskId:
          type: string
        recordId:
          type: string
        status:
          type: string
          enum:
            - 待复核
            - 已完成
        issueType:
          type: string
        score:
          type: integer
        createTime:
          type: string
          format: date-time
          description: 创建时间
        deadlineTime:
          type: string
          format: date-time
          description: 复核截止时间（7个工作日时限）
        overdue:
          type: boolean
          description: 是否已超截止时间（计算属性，仅视觉提醒，不自动流转）
        structuredData:
          $ref: '#/components/schemas/StructuredData'
          description: 已存储的NLP结构化抽取结果，供复核页左侧对照展示（免单独请求）
    ReviewTasksVO:
      type: object
      description: 复核任务列表（出参）
      properties:
        total:
          type: integer
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ReviewTaskVO'
    ReviewDTO:
      type: object
      description: 人工校正与复核请求（入参；correctedData 允许传 null，代表仅裁定不修改数据）
      properties:
        correctedData:
          anyOf:
            - $ref: '#/components/schemas/StructuredData'
            - nullable: true
        comment:
          type: string
    ReviewResultVO:
      type: object
      description: 复核结果（出参）
      properties:
        status:
          type: string
          enum:
            - 已完成
            - 待复核
        score:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              msg:
                type: string
    # ========== 词典管理 DTO / VO ==========
    DictionaryImportDTO:
      type: object
      description: 术语库导入请求（入参，multipart）
      properties:
        type:
          type: string
          enum:
            - disease
            - symptom
            - pattern
            - herb
            - formula
        file:
          type: string
          format: binary
          description: import 支持 Excel(.xlsx/.xls) / CSV / JSON；convert 支持 PDF
    DictionaryImportVO:
      type: object
      description: 术语库导入结果（出参）
      properties:
        type:
          type: string
        total:
          type: integer
        imported:
          type: integer
        failed:
          type: integer
        failures:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              reason:
                type: string
    DictionaryConvertVO:
      type: object
      description: 术语库 PDF 转换预览（出参）；预览不落库，确认后调 /api/dictionary/import 入库
      properties:
        type:
          type: string
        candidates:
          type: array
          items:
            type: object
            properties:
              standardTerm:
                type: string
              aliases:
                type: array
                items:
                  type: string
              source:
                type: string
              code:
                type: string
                description: 可选国标代码（GB/T 15657 / GB/T 16751）
        failed:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              reason:
                type: string
    DictionaryTermVO:
      type: object
      description: 术语条目（出参）
      properties:
        standardTerm:
          type: string
        aliases:
          type: array
          items:
            type: string
    DictionaryTermsVO:
      type: object
      description: 术语列表（出参）
      properties:
        terms:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryTermVO'
    RollbackDTO:
      type: object
      description: 术语库回滚请求（入参）
      required:
        - type
        - backupFilename
      properties:
        type:
          type: string
          enum:
            - disease
            - symptom
            - pattern
            - herb
            - formula
        backupFilename:
          type: string
          description: 备份文件名，如 symptoms.json.bak_20260811_143000
    # ========== 统计 DTO / VO ==========
    StatsDTO:
      type: object
      description: 数据统计请求（入参；上层控制 recordIds 数量上限，接口内部不分页）
      required:
        - type
        - recordIds
      properties:
        type:
          type: string
          enum:
            - disease
            - symptom
            - pattern
            - prescription
          description: disease疾病频次 / pattern证候分布 / symptom症状频次 / prescription方剂中药频次
        recordIds:
          type: array
          items:
            type: string
    StatsVO:
      type: object
      description: 统计响应（出参，按 type 返回不同结构）
      properties:
        statistics:
          type: array
          description: type=symptom
          items:
            type: object
            properties:
              symptom:
                type: string
              count:
                type: integer
        distribution:
          type: array
          description: type=pattern
          items:
            type: object
            properties:
              pattern:
                type: string
              count:
                type: integer
        formulaStats:
          type: array
          description: type=prescription 方剂
          items:
            type: object
            properties:
              formula:
                type: string
              count:
                type: integer
        herbStats:
          type: array
          description: type=prescription 中药
          items:
            type: object
            properties:
              herb:
                type: string
              count:
                type: integer
        trend:
          type: array
          description: 质控趋势（批C·4.2，/api/stats/extra）：按就诊月份，最近 12 个月升序
          items:
            type: object
            properties:
              month:
                type: string
                example: '2026-01'
              total:
                type: integer
              qualified:
                type: integer
              qualifiedRate:
                type: number
                format: float
              pendingReview:
                type: integer
        departmentRates:
          type: array
          description: 科室合格率（批C·4.2，/api/stats/extra）
          items:
            type: object
            properties:
              department:
                type: string
              total:
                type: integer
              qualified:
                type: integer
              qualifiedRate:
                type: number
                format: float
        scoreDistribution:
          type: array
          description: 评分分布直方图（批C·4.2，/api/stats/extra；90+ / 80-89 / 70-79 / 60-69 / 60以下，固定顺序）
          items:
            type: object
            properties:
              bucket:
                type: string
              count:
                type: integer
        dictionary:
          type: object
          description: 词典规模（批C·4.2，/api/stats/extra；5 类术语数量）
          properties:
            disease:
              type: integer
            symptom:
              type: integer
            pattern:
              type: integer
            herb:
              type: integer
            formula:
              type: integer
    StatsOverviewVO:
      type: object
      description: 首页看板指标卡（出参），一次请求返回四个总览指标
      properties:
        totalRecords:
          type: integer
          description: 病历总数
        qualifiedCount:
          type: integer
          description: 合格数（质控等级=合格）
        qualifiedRate:
          type: number
          format: float
          description: 合格率（百分比，保留1位小数）
        pendingReviewCount:
          type: integer
          description: 待复核数
        invalidCount:
          type: integer
          description: 无效数（隔离归档）
    StatsAllVO:
      type: object
      description: 首页看板一次拉取（出参）：指标卡 + 4 类统计，消除 5 个并发请求
      properties:
        overview:
          $ref: '#/components/schemas/StatsOverviewVO'
        disease:
          $ref: '#/components/schemas/StatsVO'
        symptom:
          $ref: '#/components/schemas/StatsVO'
        pattern:
          $ref: '#/components/schemas/StatsVO'
        prescription:
          $ref: '#/components/schemas/StatsVO'
    # ========== AI 助手 DTO / VO（interpret / chat / review 共享） ==========
    AiQueryDTO:
      type: object
      description: AI 解读/问答/复核请求（入参，共享）：interpret 用 recordId；chat 用 question（+ 可选 recordId）；review 用 recordId + correctedData（批D）
      properties:
        recordId:
          type: string
          description: 病历ID（interpret 必填；chat 可选，"这份病历…"类问题需要）
        question:
          type: string
          description: 使用者业务问题（chat 必填）
        history:
          type: string
          description: 追问上下文（chat 可选）：本会话近期问答，前端拼好后传入，用于多轮追问
    AiReplyVO:
      type: object
      description: AI 结果（出参，共享）；规则出结论 + LLM 叙述，LLM 不可用降级且规则结论保留
      properties:
        answer:
          type: string
          description: 自然语言回答/叙述（interpret 的报告叙述 或 chat 的问答回复，恒非空）
        source:
          type: string
          description: 来源：llm（模型）/ rule（降级规则）
          enum:
            - llm
            - rule
        llmAvailable:
          type: boolean
          description: LLM 是否可用；false 时 answer 为模板/规则降级、summary 为 null
        summary:
          type: object
          nullable: true
          description: 病历要点摘要（interpret，LLM 生成）；LLM 不可用或 chat 时为 null
          properties:
            chiefComplaint:
              type: string
              description: 主诉
            diagnosis:
              type: string
              description: 诊断（中医诊断）
            syndrome:
              type: string
              description: 辨证
            prescription:
              type: string
              description: 方药
        completeness:
          type: object
          nullable: true
          description: 完整性分析（interpret，21 字段口径）；chat 时为 null
          properties:
            total:
              type: integer
              example: 21
            present:
              type: integer
            missing:
              type: array
              items:
                type: string
        coreMissing:
          type: array
          description: 核心要素缺失清单（interpret；症状/证候/舌象/脉象/中药，真缺失口径）
          items:
            type: string
        normHits:
          type: object
          nullable: true
          description: 归一命中分布（interpret；精确/包含/模糊）；chat 时为 null
          properties:
            exact:
              type: integer
            contain:
              type: integer
            fuzzy:
              type: integer
            total:
              type: integer
        keyHints:
          type: array
          description: 关键提示（interpret；如"辨证结论为空""处方缺失"）
          items:
            type: string
        disclaimer:
          type: string
          example: AI辅助分析，最终以人工复核为准
paths:
  /api/auth/register:
    post:
      tags:
        - 认证
      summary: 用户注册
      description: 【权限：公开】注册账号角色固定为「审核员」，不开放管理员注册（请求体传入的 role 会被忽略）；管理员账号由 database-init.sql 预置
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
            example:
              username: newuser
              password: '123456'
      responses:
        '200':
          description: 注册成功（角色固定为审核员）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 注册成功
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      role:
                        type: string
                        example: 审核员
        '400':
          description: 参数非法或用户名已存在（code=400）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: 【权限：公开】账号密码登录鉴权，下发令牌与角色信息，登录成功按角色返回菜单列表
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
            example:
              username: admin
              password: '123456'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 登录成功
                  data:
                    $ref: '#/components/schemas/LoginVO'
        '400':
          description: 参数非法（如用户名或密码为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          description: 用户名或密码错误 / 用户不存在或已停用（code=401）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  msg:
                    type: string
                    example: 用户名或密码错误
                  data:
                    type: object
                    nullable: true
  /api/logs:
    get:
      tags:
        - 日志
      summary: 操作日志分页查询
      description: 【权限：仅管理员】读 operation_log 表（批A·C5 双写入库）分页筛选；文件 logs/operation.log 为兜底备份
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          description: 操作人 / 操作对象 / 详情 关键字
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 分页结果 {list, total}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/OperationLogVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/logs/actions:
    get:
      tags:
        - 日志
      summary: 操作类型选项
      description: 【权限：仅管理员】返回 operation_log 中实际出现过的 action 值，供前端筛选下拉动态渲染，避免前端写死清单与后端调用点漂移
      responses:
        '200':
          description: 操作类型列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
