        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          description: 术语索引不可用（code=1010）。归一自 2026-09-23 起只认 ES 索引、不再有内存兜底，因此索引不可用时明确报错，而不是把词静默判成「未收录」
