openapi: 3.0.3
info:
  title: 中医电子病历质控与标准化系统
  description: |
    中医电子病历质控与标准化系统接口文档。

    ## 权限约定
    接口分四档权限，各接口在 description 首部以【权限：…】标注：
    - **仅管理员**：管理类操作（词典导入/回滚、数据清洗、数据集导出、日志审计、质控评分与重算）。
    - **登录即可**：只读查询与业务计算（术语查询/归一、统计看板、NLP 抽取、原始病历查看）。
    - **管理员 / 审核员**：复核相关接口（复核任务列表、提交复核）。
    - **公开**：用户登录、用户注册。
    审核员另受**数据域（行级权限）**约束：仅可读取 grade='待复核' 的病历；管理员为全库。
    执行顺序固定为「先数据域、后用户筛选」取交集，用户筛选条件不得绕过数据域。
    权限不足统一返回 HTTP 403（code=403）。
    ## 实体分层命名约定
    - **DTO**（后缀 DTO）：请求体入参模型，接口入参统一使用。
    - **VO**（后缀 VO）：响应体出参模型，接口出参统一使用。
    - **PO**（后缀 PO）：数据库持久层实体，内部使用，不暴露于接口，故本文档不列出。
    - **共享模型**（无后缀）：跨请求/响应复用的数据模型（如 StructuredData、Entity、Herb、RecordMetadata），见数据模型定义。
    ## 接口通用约定
    除标注「文件流下载」的接口外，所有接口统一返回 Result 包装 {"code":200,"msg":"string","data":any}。
    - code: 200成功；400参数非法；401未登录/token失效；403权限不足；404资源不存在；500服务异常。
    - 登录态：非登录接口需在请求头携带 Authorization: Bearer <token>。
    - 实体识别无结果统一返回空数组 []，禁止返回 null。
    - 分页统一参数：page（从1开始）、pageSize。
    - 错误响应统一结构见 ErrorVO（code/msg/data，非 200 时 data 为 null）。
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: 认证
    description: 用户登录鉴权
  - name: 病历管理
    description: 病历导入、新增、查看、修改、删除、查询
  - name: NLP抽取
    description: 中医四诊实体抽取
  - name: 清洗与导出
    description: 术语标准化、数据清洗规整、数据集导出
  - name: 质控
    description: 事前质控、诊疗逻辑校验、终末评分
  - name: 复核
    description: 人工校正与复核
  - name: 词典管理
    description: 术语库导入、查询、回滚
  - name: 统计查询
    description: 症状频次/证候分布/方剂中药频次
  - name: 日志
    description: 操作日志导出
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未登录或 token 缺失/过期（code=401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorVO'
    Forbidden:
      description: 权限不足（code=403）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorVO'
    ServerError:
      description: 服务异常（code=500）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorVO'
  schemas:
    # ========== 通用响应包装（VO） ==========
    ResultVO:
      type: object
      description: 统一响应包装（出参）
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data:
          nullable: true
    ErrorVO:
      type: object
      description: 统一错误响应（出参；非 200 时 data 为 null）
      properties:
        code:
          type: integer
          description: 错误码：400/401/403/404/500 及业务错误码
        msg:
          type: string
          description: 错误描述
        data:
          type: object
          nullable: true
          example: null
    # ========== 共享数据模型（跨请求/响应复用，非 PO） ==========
    Entity:
      type: object
      description: 实体（含内容与原文片段），共享模型
      properties:
        content:
          type: string
          description: 标准表述
        sourceText:
          type: string
          description: 原文片段
    Herb:
      type: object
      description: 中药实体（含剂量），共享模型
      properties:
        name:
          type: string
          description: 中药名称
        dosage:
          type: string
          description: 剂量，如 15g
        sourceText:
          type: string
          description: 原文片段
    RecordMetadata:
      type: object
      description: 病历元数据（共享模型）
      properties:
        visitDate:
          type: string
          format: date
          example: '2024-11-20'
        department:
          type: string
          example: 内科
        tags:
          type: array
          items:
            type: string
          example:
            - 门诊
    StructuredData:
      type: object
      description: 结构化病历数据模型（共享模型：NLP 提取结果出参 / 质控评分与复核入参复用；未识别实体返回空数组 []）
      properties:
        diseases:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        symptoms:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        tongueList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        pulseList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        patternList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        causeList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        treatmentList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        formulaList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        herbs:
          type: array
          items:
            $ref: '#/components/schemas/Herb'
    # ========== 认证 DTO / VO ==========
    LoginDTO:
      type: object
      description: 登录请求（入参）
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginVO:
      type: object
      description: 登录响应（出参）
      properties:
        token:
          type: string
        role:
          type: string
          description: 管理员 / 审核员
        menus:
          type: array
          items:
            type: string
          example:
            - 首页看板
            - 病历数据
            - 结构化解析
            - 质控校验
            - 人工复核
            - 清洗与导出
            - 术语词典
            - 日志审计
    # ========== 病历管理 DTO / VO ==========
    ImportSummaryVO:
      type: object
      description: 导入摘要（出参）
      properties:
        total:
          type: integer
        success:
          type: integer
        failed:
          type: integer
        failures:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              reason:
                type: string
    ImportTaskVO:
      type: object
      description: 导入任务（出参）
      properties:
        taskId:
          type: string
        summary:
          $ref: '#/components/schemas/ImportSummaryVO'
    ImportStatusVO:
      type: object
      description: 导入进度（出参）
      properties:
        taskId:
          type: string
        status:
          type: string
          enum:
            - 处理中
            - 已完成
        total:
          type: integer
          description: 有效数据行总数
        processed:
          type: integer
          description: 已处理行数
        success:
          type: integer
          description: 成功入库数
        failed:
          type: integer
          description: 失败数
        failures:
          type: array
          description: 失败明细（文件名 + 原因）
          items:
            type: object
            properties:
              filename:
                type: string
              reason:
                type: string
    CreateRecordDTO:
      type: object
      description: 单条新增病历请求（入参，21个字段）
      required:
        - registrationNo
        - outpatientNo
      properties:
        registrationNo:
          type: string
          description: 登记号
        outpatientNo:
          type: string
          description: 门诊号
        gender:
          type: string
          description: 性别
        age:
          type: string
          description: 年龄
        visitCount:
          type: integer
          description: 就诊次数
        westernDiagnosis:
          type: string
          description: 西医诊断
        tcmDiagnosis:
          type: string
          description: 中医诊断
        presentIllness:
          type: string
          description: 现病史
        chiefComplaint:
          type: string
          description: 主诉
        selfReport:
          type: string
          description: 自诉
        inspection:
          type: string
          description: 望诊
        pulse:
          type: string
          description: 脉诊
        tongue:
          type: string
          description: 舌诊
        physicalExam:
          type: string
          description: 查体
        pattern:
          type: string
          description: 辨证结论
        prescription:
          type: string
          description: 草药
        followUp:
          type: string
          description: 随访
        treatmentEffect:
          type: string
          description: 治疗效果
        department:
          type: string
          description: 开单科室
        doctorId:
          type: string
          description: 医生工号
        visitTime:
          type: string
          format: date-time
          description: 接诊时间
    CreateRecordVO:
      type: object
      description: 新增病历响应（出参）
      properties:
        id:
          type: string
    RawRecordVO:
      type: object
      description: 原始病历查看响应（出参，21个字段）
      properties:
        id:
          type: string
        registrationNo:
          type: string
          description: 登记号
        outpatientNo:
          type: string
          description: 门诊号
        gender:
          type: string
          description: 性别
        age:
          type: string
          description: 年龄
        visitCount:
          type: integer
          description: 就诊次数
        westernDiagnosis:
          type: string
          description: 西医诊断
        tcmDiagnosis:
          type: string
          description: 中医诊断
        presentIllness:
          type: string
          description: 现病史
        chiefComplaint:
          type: string
          description: 主诉
        selfReport:
          type: string
          description: 自诉
        inspection:
          type: string
          description: 望诊
        pulse:
          type: string
          description: 脉诊
        tongue:
          type: string
          description: 舌诊
        physicalExam:
          type: string
          description: 查体
        pattern:
          type: string
          description: 辨证结论
        prescription:
          type: string
          description: 草药
        followUp:
          type: string
          description: 随访
        treatmentEffect:
          type: string
          description: 治疗效果
        department:
          type: string
          description: 开单科室
        doctorId:
          type: string
          description: 医生工号
        visitTime:
          type: string
          format: date-time
          description: 接诊时间
    UpdateRecordDTO:
      type: object
      description: 修改病历请求（入参，仅结构化数据，原始字段不可修改）
      properties:
        structuredData:
          $ref: '#/components/schemas/StructuredData'
    DeleteRecordsDTO:
      type: object
      description: 批量删除请求（入参）
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
    DeleteRecordsVO:
      type: object
      description: 删除响应（出参）
      properties:
        deletedCount:
          type: integer
    OperationLogVO:
      type: object
      description: 操作日志（出参，operation_log 表字段）
      properties:
        id:
          type: string
        logTime:
          type: string
          format: date-time
          description: 操作时间
        operator:
          type: string
          description: 操作人用户名
        role:
          type: string
          description: 操作人角色
        action:
          type: string
          description: 操作类型
        target:
          type: string
          description: 操作对象
        detail:
          type: string
          description: 操作明细
        ip:
          type: string
    SearchDTO:
      type: object
      description: 多条件查询请求（入参）
      properties:
        registrationNo:
          type: string
          description: 登记号
        outpatientNo:
          type: string
          description: 门诊号
        gender:
          type: string
          description: 性别
        department:
          type: string
          description: 开单科室
        doctorId:
          type: string
          description: 医生工号
        dateRange:
          type: array
          items:
            type: string
            format: date
          description: [开始日期, 结束日期]
        pattern:
          type: string
          description: 辨证结论关键词
        grade:
          type: string
          description: 分级（合格/待复核/无效）
        status:
          type: string
          description: 病历状态，如 invalid 查询无效数据
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
    SearchVO:
      type: object
      description: 查询响应（出参）
      properties:
        total:
          type: integer
        records:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              summary:
                type: string
    # ========== NLP 抽取 DTO / VO ==========
    NlpExtractDTO:
      type: object
      description: NLP 抽取请求（入参）
      required:
        - text
      properties:
        text:
          type: string
          description: 待抽取的病历文本
    NlpExtractVO:
      type: object
      description: NLP 抽取响应（出参，结构同 StructuredData）
      properties:
        diseases:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        symptoms:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        tongueList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        pulseList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        patternList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        causeList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        treatmentList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        formulaList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        herbs:
          type: array
          items:
            $ref: '#/components/schemas/Herb'
    # ========== 清洗与导出 DTO / VO ==========
    NormalizeDTO:
      type: object
      description: 术语标准化请求（入参）
      required:
        - type
        - term
      properties:
        type:
          type: string
          enum:
            - disease
            - symptom
            - pattern
            - herb
            - formula
          description: disease疾病 / pattern证候 / symptom症状 / herb中药 / formula方剂
        term:
          type: string
          description: 口语化/非标准术语
    NormalizeVO:
      type: object
      description: 术语标准化响应（出参；未命中时 standardTerm 返回原词、source 返回空字符串）
      properties:
        standardTerm:
          type: string
        source:
          type: string
    CleanDTO:
      type: object
      description: 数据清洗请求（入参）
      required:
        - recordIds
      properties:
        recordIds:
          type: array
          items:
            type: string
    CleanVO:
      type: object
      description: 清洗结果（出参）
      properties:
        deduped:
          type: integer
        repaired:
          type: integer
        cleared:
          type: integer
        isolated:
          type: integer
        total:
          type: integer
        normalized:
          type: integer
          description: 术语归一命中总数
        normByLevel:
          type: object
          description: 术语归一三级命中分布（精确/包含/模糊）
          properties:
            exact:
              type: integer
            contain:
              type: integer
            fuzzy:
              type: integer
    ExportDatasetDTO:
      type: object
      description: 数据集导出请求（入参）
      properties:
        format:
          type: string
          enum:
            - csv
            - json
          default: csv
        filters:
          type: object
          description: 复用基础查询条件
    # ========== 质控 DTO / VO ==========
    QcCheckDTO:
      type: object
      description: 事前质控检查请求（入参）
      properties:
        structuredData:
          $ref: '#/components/schemas/StructuredData'
    QcCheckVO:
      type: object
      description: 质控检查响应（出参）
      properties:
        missingFields:
          type: array
          items:
            type: string
        formatErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              msg:
                type: string
        isDuplicate:
          type: boolean
    LogicCheckDTO:
      type: object
      description: 诊疗逻辑一致性检查请求（入参，数组形式）
      properties:
        patternList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        treatmentList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        formulaList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        herbList:
          type: array
          items:
            $ref: '#/components/schemas/Herb'
    LogicCheckVO:
      type: object
      description: 逻辑一致性检查响应（出参）
      properties:
        consistent:
          type: boolean
        conflicts:
          type: array
          items:
            type: string
    QcScoreDTO:
      type: object
      description: 终末质控评分请求（入参）
      properties:
        structuredData:
          $ref: '#/components/schemas/StructuredData'
        qcResults:
          type: object
          description: 事前质控结果
    QcScoreVO:
      type: object
      description: 评分响应（出参；满分100，最低0）
      properties:
        score:
          type: integer
        grade:
          type: string
          enum:
            - 合格
            - 待复核
            - 无效
        deductions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              points:
                type: integer
    # ========== 复核 DTO / VO ==========
    ReviewTaskVO:
      type: object
      description: 复核任务（出参；超时仅前端高亮提醒，系统不自动变更任务状态）
      properties:
        taskId:
          type: string
        recordId:
          type: string
        status:
          type: string
          enum:
            - 待复核
            - 已完成
        issueType:
          type: string
        score:
          type: integer
        createTime:
          type: string
          format: date-time
          description: 创建时间
        deadlineTime:
          type: string
          format: date-time
          description: 复核截止时间（7个工作日时限）
        structuredData:
          $ref: '#/components/schemas/StructuredData'
          description: 已存储的NLP结构化抽取结果，供复核页左侧对照展示（免单独请求）
    ReviewTasksVO:
      type: object
      description: 复核任务列表（出参）
      properties:
        total:
          type: integer
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ReviewTaskVO'
    ReviewDTO:
      type: object
      description: 人工校正与复核请求（入参；correctedData 允许传 null，代表仅裁定不修改数据）
      properties:
        correctedData:
          anyOf:
            - $ref: '#/components/schemas/StructuredData'
            - nullable: true
        comment:
          type: string
    ReviewResultVO:
      type: object
      description: 复核结果（出参）
      properties:
        status:
          type: string
          enum:
            - 已完成
            - 待复核
        score:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              msg:
                type: string
    # ========== 词典管理 DTO / VO ==========
    DictionaryImportDTO:
      type: object
      description: 术语库导入请求（入参，multipart）
      properties:
        type:
          type: string
          enum:
            - disease
            - symptom
            - pattern
            - herb
            - formula
        file:
          type: string
          format: binary
          description: import 支持 Excel(.xlsx/.xls) / CSV / JSON；convert 支持 PDF
    DictionaryImportVO:
      type: object
      description: 术语库导入结果（出参）
      properties:
        type:
          type: string
        total:
          type: integer
        imported:
          type: integer
        failed:
          type: integer
        failures:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              reason:
                type: string
    DictionaryConvertVO:
      type: object
      description: 术语库 PDF 转换预览（出参）；预览不落库，确认后调 /api/dictionary/import 入库
      properties:
        type:
          type: string
        candidates:
          type: array
          items:
            type: object
            properties:
              standardTerm:
                type: string
              aliases:
                type: array
                items:
                  type: string
              source:
                type: string
              code:
                type: string
                description: 可选国标代码（GB/T 15657 / GB/T 16751）
        failed:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              reason:
                type: string
    DictionaryTermVO:
      type: object
      description: 术语条目（出参）
      properties:
        standardTerm:
          type: string
        aliases:
          type: array
          items:
            type: string
    DictionaryTermsVO:
      type: object
      description: 术语列表（出参）
      properties:
        terms:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryTermVO'
    RollbackDTO:
      type: object
      description: 术语库回滚请求（入参）
      required:
        - type
        - backupFilename
      properties:
        type:
          type: string
          enum:
            - disease
            - symptom
            - pattern
            - herb
            - formula
        backupFilename:
          type: string
          description: 备份文件名，如 symptoms.json.bak_20260811_143000
    # ========== 统计 DTO / VO ==========
    StatsDTO:
      type: object
      description: 数据统计请求（入参；上层控制 recordIds 数量上限，接口内部不分页）
      required:
        - type
        - recordIds
      properties:
        type:
          type: string
          enum:
            - disease
            - symptom
            - pattern
            - prescription
          description: disease疾病频次 / pattern证候分布 / symptom症状频次 / prescription方剂中药频次
        recordIds:
          type: array
          items:
            type: string
    StatsVO:
      type: object
      description: 统计响应（出参，按 type 返回不同结构）
      properties:
        statistics:
          type: array
          description: type=symptom
          items:
            type: object
            properties:
              symptom:
                type: string
              count:
                type: integer
        distribution:
          type: array
          description: type=pattern
          items:
            type: object
            properties:
              pattern:
                type: string
              count:
                type: integer
        formulaStats:
          type: array
          description: type=prescription 方剂
          items:
            type: object
            properties:
              formula:
                type: string
              count:
                type: integer
        herbStats:
          type: array
          description: type=prescription 中药
          items:
            type: object
            properties:
              herb:
                type: string
              count:
                type: integer
    StatsOverviewVO:
      type: object
      description: 首页看板指标卡（出参），一次请求返回四个总览指标
      properties:
        totalRecords:
          type: integer
          description: 病历总数
        qualifiedCount:
          type: integer
          description: 合格数（质控等级=合格）
        qualifiedRate:
          type: number
          format: float
          description: 合格率（百分比，保留1位小数）
        pendingReviewCount:
          type: integer
          description: 待复核数
        invalidCount:
          type: integer
          description: 无效数（隔离归档）
paths:
  /api/auth/register:
    post:
      tags:
        - 认证
      summary: 用户注册
      description: 【权限：公开】注册账号角色固定为「审核员」，不开放管理员注册（请求体传入的 role 会被忽略）；管理员账号由 database-init.sql 预置
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
            example:
              username: newuser
              password: '123456'
      responses:
        '200':
          description: 注册成功（角色固定为审核员）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 注册成功
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      role:
                        type: string
                        example: 审核员
        '400':
          description: 参数非法或用户名已存在（code=400）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: 【权限：公开】账号密码登录鉴权，下发令牌与角色信息，登录成功按角色返回菜单列表
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
            example:
              username: admin
              password: '123456'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 登录成功
                  data:
                    $ref: '#/components/schemas/LoginVO'
        '400':
          description: 参数非法（如用户名或密码为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          description: 用户名或密码错误 / 用户不存在或已停用（code=401）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  msg:
                    type: string
                    example: 用户名或密码错误
                  data:
                    type: object
                    nullable: true
  /api/logs:
    get:
      tags:
        - 日志
      summary: 操作日志分页查询
      description: 【权限：仅管理员】读 operation_log 表（批A·C5 双写入库）分页筛选；文件 logs/operation.log 为兜底备份
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          description: 操作人 / 操作对象 / 详情 关键字
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 分页结果 {list, total}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/OperationLogVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/logs/export:
    get:
      tags:
        - 日志
      summary: 操作日志导出
      description: 【权限：仅管理员】读取 logs/operation.log 日志文件，作为文件流返回下载（不套 Result 包装）
      responses:
        '200':
          description: 日志文件流
          content:
            text/plain:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: 日志文件不存在或读取失败（code=500）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
  /api/records/import:
    post:
      tags:
        - 病历管理
      summary: 病历批量导入
      description: |
        【权限：仅管理员】
        批量上传病历Excel文件（.xlsx），校验格式并创建导入任务。
        约束：单文件最大50MB，单次最多20个文件。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: 导入任务已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 导入任务已创建
                  data:
                    $ref: '#/components/schemas/ImportTaskVO'
        '400':
          description: 文件格式不支持 / 上传数超限（最多20个）/ 单文件超限（最大50MB）/ 文件为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/records/import/{taskId}/status:
    get:
      tags:
        - 病历管理
      summary: 导入进度查询
      description: 【权限：仅管理员】查询批量导入任务处理进度。任务状态暂存服务内存，服务重启后丢失
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/ImportStatusVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 任务不存在或服务重启后任务状态丢失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/records:
    post:
      tags:
        - 病历管理
