      summary: AI助手问答
      description: |
        【权限：登录即可】面向使用者的项目业务问答（数据/功能/流程/判定原因），不回答技术实现问题。
        路由：数据类问题→stats；归一/分布→归一命中；"这份病历…"→recordId 活跃详情；功能/流程/标准依据→知识注入；
        技术实现问题→兜底拒答。LLM 不可用→降级规则问答（source=rule）。单轮问答，无会话历史。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiQueryDTO'
            example:
              question: 当前合格率与待复核构成
              recordId: 3f2a1b0c-...
      responses:
        '200':
          description: 回答
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/AiReplyVO'
        '400':
          description: question 为空（code=400）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/ai/review:
    post:
      tags:
        - AI助手
      summary: AI复核预检意见
      description: |
        【权限：管理员 / 审核员】基于规则预检单（qc_results / 重算）与 structuredData 生成复核建议
        （疑缺脉象 / 证候-方剂冲突 / 建议复核重点）；判定仍为规则，LLM 仅叙述；
        LLM 关/挂 → 回退预检单原文。读取受数据域约束（审核员仅待复核域）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiQueryDTO'
            example:
              recordId: 3f2a1b0c-...
      responses:
        '200':
          description: 复核建议
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/AiReplyVO'
        '400':
          description: recordId 为空（code=400）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 病历不存在或不在数据域内（code=1006）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/llm/config:
    get:
      tags:
        - LLM配置
      summary: 读取 LLM 配置
      description: 【权限：仅管理员】读取当前生效的 LLM 配置。api-key 只回传掩码（如 sk-****abcd），明文密钥不出服务端
      responses:
        '200':
          description: 当前生效配置
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/LlmConfigVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - LLM配置
      summary: 覆盖 LLM 配置
      description: |
        【权限：仅管理员】覆盖运行时生效的 LLM 配置，保存即生效、无需重启。
        只作用于内存，不写回 application.yml，重启后回到配置文件基线；
        需要长期生效请写入配置文件的 llm 段。apiKey 传空串或掩码表示不修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmConfigDTO'
            example:
              enabled: true
              provider: ollama
              baseUrl: http://localhost:11434
              apiKey: ''
              model: qwen2.5:7b
              temperature: 0.2
              timeout: 60000
      responses:
        '200':
          description: 生效后的配置
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/LlmConfigVO'
        '400':
          description: 参数非法（通道非 ollama/openai、温度越界、超时越界，或选 openai 但未填 api-key）（code=400）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/llm/test:
    post:
      tags:
        - LLM配置
      summary: LLM 连通性探测
      description: 【权限：仅管理员】用请求体参数（省略则用当前生效配置）发一轮最小请求探测连通性，先试后存；不改变当前生效配置。探测超时上限 20 秒
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmConfigDTO'
      responses:
        '200':
          description: 连接正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/LlmTestVO'
        '400':
          description: 参数非法（通道非 ollama/openai，或选 openai 但未填 api-key）（code=400）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: 上游模型服务不可达或鉴权失败（code=1009，消息已脱敏可直接展示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'
