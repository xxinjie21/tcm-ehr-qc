      description: |
        【权限：登录即可】（批次 15 · 15.1）与三个同步接口同一套校验，只是把「等 LLM 生成」搬到专用线程池：
        请求线程立即返回 202 + 任务号，前端轮询 GET /api/ai/async/{taskId}，用户可离开页面再回来取结果。
        同步接口保留不动（向后兼容）。kind=interpret/review 需 recordId；kind=chat 需 question。
      parameters:
        - name: kind
          in: path
          required: true
          description: AI 动作
          schema:
            type: string
            enum: [interpret, chat, review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiQueryDTO'
            example:
              recordId: 3f2a1b0c-...
      responses:
        '202':
          description: 已受理，data={taskId}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      taskId:
                        type: string
        '400':
          description: kind 不在 interpret/chat/review 内；或非 chat 缺 recordId、chat 缺 question（code=400）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/ai/async/{taskId}:
    get:
      tags:
        - AI助手
      summary: 查异步任务结果
      description: |
        【权限：登录即可】（批次 15 · 15.1）任务不存在、已过期、或不属于调用者，一律返回同一个 404 ——
        不区分「不存在」与「不是你的」，否则任务号可以被用来探测。超时（超过 120 秒仍在 RUNNING）收敛为 FAILED。
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 任务快照 data={state, reply, error}；state=RUNNING 时 reply 为 null，FAILED 时 error 有值
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      state:
                        type: string
                        enum: [RUNNING, DONE, FAILED]
                      reply:
                        $ref: '#/components/schemas/AiReplyVO'
                      error:
                        type: string
                        nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 任务不存在 / 已过期 / 不属于调用者（code=1006）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'
