                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/NlpTaskVO'
        '400':
          description: 抽取服务未开启（nlp.enabled=false）等参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员
        '500':
          $ref: '#/components/responses/ServerError'
    get:
