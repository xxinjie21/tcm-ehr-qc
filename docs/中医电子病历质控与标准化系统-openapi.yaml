openapi: 3.0.3
info:
  title: 中医电子病历质控与标准化系统
  description: |
    中医电子病历质控与标准化系统接口文档。

    ## 权限约定
    接口分五档权限，各接口在 description 首部以【权限：…】标注：
    - **公开**：用户登录、用户注册。
    - **登录即可**：只读查询与业务计算（术语查询/归一、统计看板、NLP 抽取、原始病历查看、复核、日志审计）。
    - **本人**：只能读写自己的配置（LLM 通道与密钥）。
    - **管理员 / 所有者 / 授权成员**：组织级配置的写入（词典导入/回滚、质控规则保存与重置）。
    - **仅管理员**：组织治理（组织列表、停用/恢复/归档、改派所有者）。
    数据可见范围按**组织**隔离：管理员看全部（受 auth.admin-can-view-data 开关控制），其余身份只看本组织。
    执行顺序固定为「先数据域、后用户筛选」取交集，用户筛选条件不得绕过数据域。
    权限不足统一返回 HTTP 403（code=403）。
    ## 实体分层命名约定
    - **DTO**（后缀 DTO）：请求体入参模型，接口入参统一使用。
    - **VO**（后缀 VO）：响应体出参模型，接口出参统一使用。
    - **PO**（后缀 PO）：数据库持久层实体，内部使用，不暴露于接口，故本文档不列出。
    - **共享模型**（无后缀）：跨请求/响应复用的数据模型（如 StructuredData、Entity、Herb、RecordMetadata），见数据模型定义。
    ## 接口通用约定
    除标注「文件流下载」的接口外，所有接口统一返回 Result 包装 {"code":200,"msg":"string","data":any}。
    - code: 200成功；400参数非法；401未登录/token失效；403权限不足；404资源不存在；405方法不支持；409数据冲突（唯一键/外键）；415请求内容类型不支持；500服务异常。
    - 登录态：非登录接口需在请求头携带 Authorization: Bearer <token>。
    - 实体识别无结果统一返回空数组 []，禁止返回 null。
    - 分页统一参数：page（从1开始）、pageSize（单页上限 500，超出按 500 截断，避免一次拉全表）。注意 POST /api/records/search 的入参 body.pageSize 另限 200（见 SearchDTO），超限直接 400 —— 两处上限不同是有意为之。
    - 错误响应统一结构见 ErrorVO（code/msg/data，非 200 时 data 为 null）。
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: 认证
    description: 用户登录鉴权
  - name: 病历管理
    description: 病历导入、新增、查看、修改、删除、查询
  - name: NLP抽取
    description: 中医四诊实体抽取
  - name: 清洗与导出
    description: 术语标准化、数据清洗规整、数据集导出
  - name: 质控
    description: 事前质控、诊疗逻辑校验、终末评分
  - name: 复核
    description: 人工校正与复核
  - name: 词典管理
    description: 术语库导入、查询、回滚
  - name: 统计查询
    description: 症状频次/证候分布/方剂中药频次
  - name: 日志
    description: 操作日志导出
  - name: AI助手
    description: AI 质控解读与业务问答（规则出结论 + LLM 叙述，LLM 不可用降级）
  - name: LLM配置
    description: 运行时 LLM 通道配置（ollama / openai 兼容），保存即生效
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未登录或 token 缺失/过期（code=401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorVO'
    Forbidden:
      description: 权限不足（code=403）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorVO'
    ServerError:
      description: 服务异常（code=500）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorVO'
  schemas:
    # ========== 通用响应包装（VO） ==========
    ResultVO:
      type: object
      description: 统一响应包装（出参）
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data:
          nullable: true
    ErrorVO:
      type: object
      description: 统一错误响应（出参；非 200 时 data 为 null）
      properties:
        code:
          type: integer
          description: 错误码：400/401/403/404/500 及业务错误码
        msg:
          type: string
          description: 错误描述
        data:
          type: object
          nullable: true
          example: null
    # ========== 共享数据模型（跨请求/响应复用，非 PO） ==========
    StandardizationReportRange:
      type: object
      description: 本次统计的接诊时间区间
      properties:
        start: { type: string, description: 生效的起（yyyy-MM-dd），空表示不限 }
        end: { type: string, description: 生效的止（yyyy-MM-dd），空表示不限 }
        records: { type: integer, description: 区间内病历数 }
        excluded: { type: integer, description: 被过滤掉的病历数；0 表示未过滤 }

    StandardizationReportMonth:
      type: object
      properties:
        month: { type: string, description: 月份 yyyy-MM；接诊时间为空时为「未知」 }
        records: { type: integer }
        symptomRate: { type: string, description: 该月症状归一率，未抽取到症状时为空 }
        avgScore: { type: number, format: double, description: 该月平均质控分 }
        capped: { type: integer, description: 该月质控扣满上限的病历数 }
        dictionaryGap: { type: integer, description: 该月症状词表缺口条数（补词表能解决的部分） }

    QcCoverage:
      type: object
      description: 质控完成度。报告里的分数与扣分来自 qc_results（质控跑完时写下的结果），质控未完成时这些数字是旧口径，页面应先提示重跑质控再展示结论
      properties:
        total: { type: integer, description: 数据域内病历总数 }
        scored: { type: integer, description: 已完成质控评分的病历数 }
        complete: { type: boolean, description: 是否已全部完成 }
        lastScoredAt: { type: string, description: 最近一次质控完成时间 }

    DictionaryLint:
      type: object
      description: 词表质量体检结果（批次 21）。同名重复等硬错误会导致导入静默少词或播种整批失败，必须入库前发现
      properties:
        total:
          type: integer
          description: 本次体检的词条数
        passed:
          type: boolean
          description: 是否通过（errors 为空即通过）
        errors:
          type: array
          description: 硬错误，必须改
          items:
            $ref: '#/components/schemas/DictionaryLintIssue'
        warnings:
          type: array
          description: 警告，不改也能入库但大概率是疏忽
          items:
            $ref: '#/components/schemas/DictionaryLintIssue'
        topIssues:
          type: array
          description: 按影响面排序的前若干条，便于先改覆盖面最大的那类
          items:
            $ref: '#/components/schemas/DictionaryLintIssue'

    DictionaryLintIssue:
      type: object
      properties:
        kind: { type: string, description: 问题类型 }
        message: { type: string, description: 人话描述，说明为什么这是问题 }
        terms: { type: string, description: 涉及的标准术语，多个用、分隔 }
        advice: { type: string, description: 建议怎么改 }
        level: { type: string, enum: [error, warning] }
        count: { type: integer, description: 影响条数 }

    StandardizationReport:
      type: object
      description: 标准化质量报告（甲类=标准符合度为目标；乙类=数据集覆盖度仅为下限验证）
      properties:
        dictQuality:
          type: array
          description: 甲类·各类词典质量画像
          items:
            type: object
            properties:
              type: { type: string, description: 术语类型 key }
              label: { type: string, description: 中文名 }
              termCount: { type: integer, description: 词条数 }
              codedCount: { type: integer, description: 有编码的词条数 }
              aliasedCount: { type: integer, description: 有别名的词条数 }
              selfAliasCount: { type: integer, description: 别名与标准词相同的条数（归一会自命中） }
              source: { type: string, description: 主要来源标注 }
        crossTypeDuplicates:
          type: array
          description: 甲类·跨类重名术语（同一词出现在多本词典）
          items: { type: string }
        coverage:
          type: array
          description: 乙类·各类实体抽取数与已归一数
          items:
            type: object
            properties:
              field: { type: string, description: structured_data 字段名 }
              label: { type: string }
              total: { type: integer }
              normalized: { type: integer }
        unmatched:
          type: object
          description: 乙类·症状未归一实体的四类构成（责任方不同，不可合并）
          properties:
            total: { type: integer }
            fragment: { type: integer, description: 抽取碎片，责任在抽取侧 }
            misrouted: { type: integer, description: 脉/舌要素进了症状，责任在抽取侧 }
            physicalSign: { type: integer, description: 体征错放，责任在抽取侧 }
            dictionaryGap: { type: integer, description: 多为标准词，责任在词表侧 }
        normalizable:
          type: object
          description: 乙类·可归一实体归一率（分母=已抽取、非抽取缺陷、已在症状词表内）
          properties:
            denominator: { type: integer }
            numerator: { type: integer }
        score:
          type: object
          description: 乙类·质控分数分布与封顶率
          properties:
            total: { type: integer }
            capped: { type: integer, description: 术语未标准化扣满 5 分的病历数 }
            min: { type: integer }
            max: { type: integer }
            avg: { type: number, format: double }
        qc:
          $ref: '#/components/schemas/QcCoverage'
        range:
          $ref: '#/components/schemas/StandardizationReportRange'
        byMonth:
          type: array
          description: 按接诊月份分组（用于看换了词表之后有没有变好；「未知」表示接诊时间为空的病历）
          items:
            $ref: '#/components/schemas/StandardizationReportMonth'
        dataset:
          type: object
          description: 乙类·数据集形态（模板塌缩度决定能否代表真实病历）
          properties:
            recordCount: { type: integer }
            chiefComplaintTemplates: { type: integer }
            recordsWithColloquialSymptom: { type: integer }
        disclaimer:
          type: string
          description: 数据来源声明，页面须原样显示不可删
        generatedAt:
          type: string
          description: 报告生成时间

    Entity:
      type: object
      description: 实体（含内容与原文片段），共享模型
      properties:
        content:
          type: string
          description: 标准表述
        sourceText:
          type: string
          description: 原文片段
        confidence:
          type: number
          format: double
          description: 置信度（0~1）；模型实体提供，规则兜底可省
        source:
          type: string
          description: 来源：model（NER 模型）/ rule（规则兜底）
          enum:
            - model
            - rule
        normLevel:
          type: integer
          description: 归一命中层级：1=精确 / 2=包含 / 3=模糊；未归一或未命中词典时不返回
        normSource:
          type: string
          description: 归一命中的术语来源（词典名）；未命中不返回
        normCode:
          type: string
          description: 国标代码；词典未收录时不返回
    Herb:
      type: object
      description: 中药实体（含剂量），共享模型
      properties:
        name:
          type: string
          description: 中药名称
        dosage:
          type: string
          description: 剂量，如 15g
        sourceText:
          type: string
          description: 原文片段
        confidence:
          type: number
          format: double
          description: 置信度（0~1）；模型实体提供，规则兜底可省
        source:
          type: string
          description: 来源：model（NER 模型）/ rule（规则兜底）
          enum:
            - model
            - rule
        normLevel:
          type: integer
          description: 归一命中层级：1=精确 / 2=包含 / 3=模糊；未归一或未命中词典时不返回
        normSource:
          type: string
          description: 归一命中的术语来源（词典名）；未命中不返回
        normCode:
          type: string
          description: 国标代码；词典未收录时不返回
    RecordMetadata:
      type: object
      description: 病历元数据（共享模型）
      properties:
        visitDate:
          type: string
          format: date
          example: '2024-11-20'
        department:
          type: string
          example: 内科
        tags:
          type: array
          items:
            type: string
          example:
            - 门诊
    StructuredData:
      type: object
      description: 结构化病历数据模型（共享模型：NLP 提取结果出参 / 质控评分与复核入参复用；未识别实体返回空数组 []）
      properties:
        diseases:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        symptoms:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        tongueList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        pulseList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        patternList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        causeList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        treatmentList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        formulaList:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        herbs:
          type: array
          items:
            $ref: '#/components/schemas/Herb'
    # ========== 认证 DTO / VO ==========
    LoginDTO:
      type: object
      description: 登录请求（入参）
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginVO:
      type: object
      description: 登录响应（出参）
      properties:
        token:
          type: string
        role:
          type: string
          description: 管理员 / 授权成员
        username:
          type: string
          description: 用户名（页面右上角显示「这是谁」，而非只显示角色）
        menus:
          type: array
          description: >-
            可见菜单（树形）。批次17 起由平铺字符串列表升级为带 children 的结构 ——
            「术语批量导入」是「术语词典」的子项，平铺列表表达不了父子关系。
          items:
            $ref: '#/components/schemas/MenuNode'
    MenuNode:
      type: object
      properties:
        title:
          type: string
          description: 菜单显示名，与前端 MainLayout 的 ALL_MENUS[].title 对应
        path:
          type: string
          description: 前端路由路径；父项也可点（如「术语词典」→ /dictionary）
        children:
          type: array
          description: 子菜单；空数组表示叶子节点
          items:
            $ref: '#/components/schemas/MenuNode'
    # ========== 病历管理 DTO / VO ==========
    ImportSummaryVO:
      type: object
      description: 导入摘要（出参）
      properties:
        total:
          type: integer
        success:
          type: integer
        failed:
          type: integer
        failures:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              reason:
                type: string
    ImportTaskVO:
      type: object
      description: 导入任务（出参）
      properties:
        taskId:
          type: string
        summary:
          $ref: '#/components/schemas/ImportSummaryVO'
    CreateRecordDTO:
      type: object
      description: 单条新增病历请求（入参，21个字段）
      required:
        - registrationNo
        - outpatientNo
      properties:
        registrationNo:
          type: string
          description: 登记号
        outpatientNo:
          type: string
          description: 门诊号
        gender:
          type: string
          description: 性别
        age:
          type: string
          description: 年龄
        visitCount:
          type: integer
          description: 就诊次数
        westernDiagnosis:
          type: string
          description: 西医诊断
        tcmDiagnosis:
          type: string
          description: 中医诊断
        presentIllness:
          type: string
          description: 现病史
        chiefComplaint:
          type: string
          description: 主诉
        selfReport:
          type: string
          description: 自诉
        inspection:
          type: string
          description: 望诊
        pulse:
          type: string
          description: 脉诊
        tongue:
          type: string
          description: 舌诊
        physicalExam:
          type: string
          description: 查体
        pattern:
          type: string
          description: 辨证结论
        prescription:
          type: string
          description: 草药
        followUp:
          type: string
          description: 随访
        treatmentEffect:
          type: string
          description: 治疗效果
        department:
          type: string
          description: 开单科室
        doctorId:
          type: string
          description: 医生工号
        visitTime:
          type: string
          format: date-time
          description: 接诊时间
    CreateRecordVO:
      type: object
      description: 新增病历响应（出参）
      properties:
        id:
          type: string
    RawRecordVO:
      type: object
      description: 原始病历查看响应（出参：21 个原始字段 + 结构化数据/评分 + 读时指纹）
      properties:
        id:
          type: string
        registrationNo:
          type: string
          description: 登记号
        outpatientNo:
          type: string
          description: 门诊号
        gender:
          type: string
          description: 性别
        age:
          type: string
          description: 年龄
        visitCount:
          type: integer
          description: 就诊次数
        westernDiagnosis:
          type: string
          description: 西医诊断
        tcmDiagnosis:
          type: string
          description: 中医诊断
        presentIllness:
          type: string
          description: 现病史
        chiefComplaint:
          type: string
          description: 主诉
        selfReport:
          type: string
          description: 自诉
        inspection:
          type: string
          description: 望诊
        pulse:
          type: string
          description: 脉诊
        tongue:
          type: string
          description: 舌诊
        physicalExam:
          type: string
          description: 查体
        pattern:
          type: string
          description: 辨证结论
        prescription:
          type: string
          description: 草药
        followUp:
          type: string
          description: 随访
        treatmentEffect:
          type: string
          description: 治疗效果
        department:
          type: string
          description: 开单科室
        doctorId:
          type: string
          description: 医生工号
        visitTime:
          type: string
          format: date-time
          description: 接诊时间
        structuredData:
          type: string
          description: 结构化数据 JSON 文本（NLP 抽取/人工修正结果）
        score:
          type: integer
          description: 质控评分（满分 100）
        grade:
          type: string
          description: 分级（合格/待复核/无效）
        status:
          type: string
          description: 状态（pending/reviewing/completed/invalid）
        fingerprint:
          type: string
          description: 读时指纹（SHA-256）；复核提交时原样回传，用于并发写校验（批次 25.15）
    UpdateRecordDTO:
      type: object
      description: 修改病历请求（入参，仅结构化数据，原始字段不可修改）
      properties:
        structuredData:
          $ref: '#/components/schemas/StructuredData'
    DeleteRecordsDTO:
      type: object
      description: 批量删除请求（入参）
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
    DeleteRecordsVO:
      type: object
      description: 删除响应（出参）
      properties:
        deletedCount:
          type: integer
    OperationLogVO:
      type: object
      description: 操作日志（出参，operation_log 表字段）
      properties:
        id:
          type: string
        logTime:
          type: string
          format: date-time
          description: 操作时间
        operator:
          type: string
          description: 操作人用户名
        role:
          type: string
          description: 操作人角色
        action:
          type: string
          description: 操作类型
        target:
          type: string
          description: 操作对象
        detail:
          type: string
          description: 操作明细
        orgId:
          type: string
          description: 操作时所属组织（出参，操作日志领域字段）
        orgName:
          type: string
          description: 所属组织名称（列表/导出展示列，服务端按 orgId 解析回填）
    QcTaskVO:
      type: object
