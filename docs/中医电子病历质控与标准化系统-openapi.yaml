            - symptom
            - pattern
            - herb
            - formula
            - tongue
            - pulse
            - treatment
        backupFilename:
          type: string
          description: 备份文件名，如 symptoms.json.bak_20260811_143000
    # ========== 统计 DTO / VO ==========
    StatsDTO:
      type: object
      description: 数据统计请求（入参；上层控制 recordIds 数量上限，接口内部不分页）
      required:
        - type
        - recordIds
      properties:
        type:
          type: string
          enum:
            - disease
            - symptom
            - pattern
            - prescription
          description: disease疾病频次 / pattern证候分布 / symptom症状频次 / prescription方剂中药频次
        recordIds:
          type: array
          items:
            type: string
    StatsVO:
      type: object
      description: 统计响应（出参，按 type 返回不同结构）
      properties:
        statistics:
          type: array
          description: type=symptom
          items:
            type: object
            properties:
              symptom:
                type: string
              count:
                type: integer
        distribution:
          type: array
          description: type=pattern
          items:
            type: object
            properties:
              pattern:
                type: string
              count:
                type: integer
        formulaStats:
          type: array
          description: type=prescription 方剂
          items:
            type: object
            properties:
              formula:
                type: string
              count:
                type: integer
        herbStats:
          type: array
          description: type=prescription 中药
          items:
            type: object
            properties:
              herb:
                type: string
              count:
                type: integer
        trendTruncated:
          type: boolean
          description: 趋势是否被截断（仅保留最近 12 个月）—— P5.2
        trend:
          type: array
          description: 质控趋势（批C·4.2，/api/stats/extra）：按就诊月份，最近 12 个月升序
          items:
            type: object
            properties:
              month:
                type: string
                example: '2026-01'
              total:
                type: integer
              qualified:
                type: integer
              qualifiedRate:
                type: number
                format: float
              pendingReview:
                type: integer
        departmentRates:
          type: array
          description: 科室合格率（批C·4.2，/api/stats/extra）
          items:
            type: object
            properties:
              department:
                type: string
              total:
                type: integer
              qualified:
                type: integer
              qualifiedRate:
                type: number
                format: float
        scoreDistribution:
          type: array
          description: 评分分布直方图（批C·4.2，/api/stats/extra；90+ / 80-89 / 70-79 / 60-69 / 60以下，固定顺序）
          items:
            type: object
            properties:
              bucket:
                type: string
              count:
                type: integer
        dictionary:
          type: object
          description: 词典规模（批C·4.2，/api/stats/extra；5 类术语数量）
          properties:
            disease:
              type: integer
            symptom:
              type: integer
            pattern:
              type: integer
            herb:
              type: integer
            formula:
              type: integer
    StatsOverviewVO:
      type: object
      description: 首页看板指标卡（出参），一次请求返回四个总览指标
      properties:
        totalRecords:
          type: integer
          description: 病历总数
        qualifiedCount:
          type: integer
          description: 合格数（质控等级=合格）
        qualifiedRate:
          type: number
          format: float
          description: 合格率（百分比，保留1位小数）
        pendingReviewCount:
          type: integer
          description: 待复核数
        invalidCount:
          type: integer
          description: 无效数（隔离归档）
    StatsAllVO:
      type: object
      description: 首页看板一次拉取（出参）：指标卡 + 4 类统计，消除 5 个并发请求
      properties:
        overview:
          $ref: '#/components/schemas/StatsOverviewVO'
        disease:
          $ref: '#/components/schemas/StatsVO'
        symptom:
          $ref: '#/components/schemas/StatsVO'
        pattern:
          $ref: '#/components/schemas/StatsVO'
        prescription:
          $ref: '#/components/schemas/StatsVO'
    # ========== AI 助手 DTO / VO（interpret / chat / review 共享） ==========
    AiQueryDTO:
      type: object
      description: AI 解读/问答/复核请求（入参，共享）：interpret 用 recordId；chat 用 question（+ 可选 recordId）；review 用 recordId + correctedData（批D）
      properties:
        recordId:
          type: string
          description: 病历ID（interpret 必填；chat 可选，"这份病历…"类问题需要）
        question:
          type: string
          description: 使用者业务问题（chat 必填）
        history:
          type: string
          description: 追问上下文（chat 可选）：本会话近期问答，前端拼好后传入，用于多轮追问
    AiReplyVO:
      type: object
      description: AI 结果（出参，共享）；规则出结论 + LLM 叙述，LLM 不可用降级且规则结论保留
      properties:
        answer:
          type: string
          description: 自然语言回答/叙述（interpret 的报告叙述 或 chat 的问答回复，恒非空）
        source:
          type: string
          description: 来源：llm（模型）/ rule（降级规则）
          enum:
            - llm
            - rule
        llmAvailable:
          type: boolean
          description: LLM 是否可用；false 时 answer 为模板/规则降级、summary 为 null
        summary:
          type: object
          nullable: true
          description: 病历要点摘要（interpret，LLM 生成）；LLM 不可用或 chat 时为 null
          properties:
            chiefComplaint:
              type: string
              description: 主诉
            diagnosis:
              type: string
              description: 诊断（中医诊断）
            syndrome:
              type: string
              description: 辨证
            prescription:
              type: string
              description: 方药
        completeness:
          type: object
          nullable: true
          description: 完整性分析（interpret，21 字段口径）；chat 时为 null
          properties:
            total:
              type: integer
              example: 21
            present:
              type: integer
            missing:
              type: array
              items:
                type: string
        coreMissing:
          type: array
          description: 核心要素缺失清单（interpret；要素取自规则集目录，默认 6 项：症状/疾病/证候/舌象/脉象/中药。真缺失口径 = 结构化结果与原始列都没有记录）
          items:
            type: string
        corePartial:
          type: array
          description: 核心要素「漏抽」清单（interpret）：结构化结果里没有、但原始列有记录，可能未被抽取。与 coreMissing 合起来才等于质控侧「核心字段缺失」两档扣分的口径
          items:
            type: string
        normHits:
          type: object
          nullable: true
          description: 归一命中分布（interpret；精确/包含/模糊）；chat 时为 null
          properties:
            exact:
              type: integer
            contain:
              type: integer
            fuzzy:
              type: integer
            total:
              type: integer
        keyHints:
          type: array
          description: 关键提示（interpret；如"辨证结论为空""处方缺失"）
          items:
            type: string
        disclaimer:
          type: string
          example: AI辅助分析，最终以人工复核为准
paths:
  /api/auth/register:
    post:
      tags:
        - 认证
      summary: 用户注册
      description: 【权限：公开】注册账号角色固定为「用户」，不开放管理员注册（请求体传入的 role 会被忽略）；管理员账号由 database-init.sql 预置
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
            example:
              username: newuser
              password: '123456'
      responses:
        '200':
          description: 注册成功（角色固定为「用户」）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 注册成功
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      role:
                        type: string
                        example: 用户
        '400':
          description: 参数非法或用户名已存在（code=400）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: 【权限：公开】账号密码登录鉴权，下发令牌与角色信息，登录成功按角色返回菜单列表
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
            example:
              username: admin
              password: '123456'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 登录成功
                  data:
                    $ref: '#/components/schemas/LoginVO'
        '400':
          description: 参数非法（如用户名或密码为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          description: 用户名或密码错误 / 用户不存在或已停用（code=401）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  msg:
                    type: string
                    example: 用户名或密码错误
                  data:
                    type: object
                    nullable: true
  /api/auth/logout:
    post:
      tags:
        - 认证
      summary: 退出登录
      description: 【权限：登录即可】作废<b>当前用户全部</b>已签发的 JWT（令牌版本 +1）。只清前端本地状态是不够的 —— 令牌在有效期内仍可被复制到别处继续调用接口。登出后该用户此前所有令牌立即失效，其它设备同时被登出
      responses:
        '200':
          description: 已退出登录
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 已退出登录

  /api/logs:
    get:
      tags:
        - 日志
      summary: 操作日志分页查询
      description: 【权限：登录即可】（§七 L7 三档）读 operation_log 表分页筛选。§七 L1/L2 后该表是唯一数据源（不记 IP、不再落文件）；§七 L3 后日志只增不删
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          description: 操作人 / 操作对象 / 详情 关键字
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 分页结果 {list, total}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/OperationLogVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/logs/by-object:
    get:
      tags:
        - 日志
      summary: 按对象查活动流
      description: 【权限：登录即可】（§七 L7 三档；对标 D3）可见范围与 GET /api/logs 完全一致（同一套 buildWrapper），只额外按对象精确过滤 —— 不能因为「是按 ID 查」就绕过数据域。病历详情页的「活动 / 历史」页签用它
      parameters:
        - name: objectType
          in: query
          required: true
          description: 对象类型，如 record
          schema:
            type: string
        - name: objectId
          in: query
          required: true
          description: 对象 ID
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 分页结果 {list, total}（按时间倒序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/OperationLogVO'
        '400':
          description: objectType 或 objectId 为空（code=400）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/logs/actions:
    get:
      tags:
        - 日志
      summary: 操作类型选项
      description: 【权限：登录即可】（§七 L7 三档）返回 operation_log 中实际出现过的 action 值，供前端筛选下拉动态渲染，避免前端写死清单与后端调用点漂移
      responses:
        '200':
          description: 操作类型列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/logs/export:
    get:
      tags:
        - 日志
      summary: 操作日志导出
      description: 【权限：登录即可】（§七 L7 三档）按筛选条件读 operation_log 表并导出为 CSV（带 UTF-8 BOM）文件流，不套 Result 包装
      responses:
        '200':
          description: 日志文件流
          content:
            text/plain:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: 导出读取失败（code=500）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
  /api/records/import:
    post:
      tags:
        - 病历管理
      summary: 病历批量导入
      description: |
        【权限：登录即可】
        批量上传病历Excel文件（.xlsx），校验格式并创建导入任务。
        约束：单文件最大50MB，单次最多20个文件；单次导入合计最多 50000 行（跨文件累计，超出后不再导入，
        剩余行以文件级失败列在 failures 中，已解析成功的行照常入库 —— 不做静默截断）。
        autoExtract=true 且后端已开启抽取时，导入完成后自动投递后台结构化解析任务（返回 autoExtractTaskId）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                autoExtract:
                  type: boolean
                  default: false
                  description: 导入后是否自动结构化解析（后台任务）
      responses:
        '200':
          description: 导入任务已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 导入任务已创建
                  data:
                    $ref: '#/components/schemas/ImportTaskVO'
        '400':
          description: 文件格式不支持 / 上传数超限（最多20个）/ 单文件超限（最大50MB）/ 文件为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/records:
    post:
      tags:
        - 病历管理
      summary: 单条新增病历
      description: 【权限：登录即可】手动新增病历并绑定元数据，完成单条病历入库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordDTO'
            example:
              registrationNo: 'R001'
              outpatientNo: 'O001'
              gender: 男
              age: 45岁
              visitCount: 1
              westernDiagnosis: 上呼吸道感染
              tcmDiagnosis: 风热感冒
              presentIllness: 患者发热咳嗽两天
              chiefComplaint: 发热、咳嗽
              selfReport: 患者自诉发热
              inspection: 面红
              pulse: 脉浮数
              tongue: 舌红苔黄
              physicalExam: 咽部充血
              pattern: 风热犯肺证
              prescription: 银翘散加减，细辛3g,桂枝6g,黄连10g
              followUp: 无
              treatmentEffect: 好转
              department: 内科
              doctorId: D001
              visitTime: '2024-11-20T10:00:00'
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 新增成功
                  data:
                    $ref: '#/components/schemas/CreateRecordVO'
        '400':
          description: 病历文本为空（code=1005）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - 病历管理
      summary: 批量删除病历
      description: 【权限：登录即可】按病历ID列表批量删除（数据由组过滤兜底）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRecordsDTO'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 删除成功
                  data:
                    $ref: '#/components/schemas/DeleteRecordsVO'
        '400':
          description: 参数非法（ids 为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 病历不存在（code=1006）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/records/delete-by-filter:
    post:
      tags:
        - 病历管理
      summary: 按范围批量删除病历
      description: 【权限：登录即可】按筛选范围（科室/时间区间/证候/分级）删除全部匹配病历；四个条件全空时拒绝（防误删全库）。删除前先清 review_tasks 外键依赖
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                department:
                  type: string
                dateRange:
                  type: array
                  items:
                    type: string
                    format: date
                pattern:
                  type: string
                grade:
                  type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/DeleteRecordsVO'
        '400':
          description: 未设置任何筛选条件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/records/raw/{recordId}:
    get:
      tags:
        - 病历管理
      summary: 病历数据查看
      description: 【权限：登录即可】根据病历ID只读查询完整病历数据（21个字段），原始字段只读锁定
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 原始病历
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/RawRecordVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 病历不存在（code=1006）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/records/{recordId}:
    put:
      tags:
        - 病历管理
      summary: 病历修改（仅元数据）
      description: 【权限：登录即可】修改病历元数据（就诊时间、科室、标签、归档状态），原始文本不可修改
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecordDTO'
            example:
