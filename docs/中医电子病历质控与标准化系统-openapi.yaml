                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 病历不存在（code=1006）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/export/dataset:
    post:
      tags:
        - 清洗与导出
      summary: 标准数据集导出
      description: 【权限：仅管理员】按条件导出质控合格的标准化病历数据集，支持 CSV/JSON 格式。文件流下载，不套 Result 包装，导出自动脱敏
      requestBody:
