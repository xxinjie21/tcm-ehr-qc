  /api/nlp/extract:
    post:
      tags:
        - NLP抽取
      summary: NLP实体抽取
      description: 【权限：登录即可】NLP实体抽取统一入口，一次返回完整结构化数据（症状/舌脉/证候病因治法/方剂中药）。Java 端转发至 Python FastAPI 服务（:8001），服务/模型不可用时降级（modelAvailable=false）。返回前对实体做术语归一（disease/symptom/pattern/formula/herb 五类走词典，舌/脉/病因/治法四类无独立词典仅保留原文）：content 为标准术语、sourceText 为归一前原文，并附 normLevel/normSource/normCode；未命中词典时 content 保持原文且不返回归一字段
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NlpExtractDTO'
            example:
              text: 患者发热咽痛两天，舌红苔黄，脉浮数。证属风热犯肺，治以辛凉解表，方用银翘散，金银花15g、连翘10g。
      responses:
        '200':
          description: 抽取结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/NlpExtractVO'
        '400':
          description: 待抽取文本为空 / 文本无法解析（乱码或非病历文本）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          description: 术语索引不可用（code=1010）。归一自 2026-09-23 起只认 ES 索引、不再有内存兜底，因此索引不可用时明确报错，而不是把词静默判成「未收录」
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorVO'
  /api/nlp/extract/batch:
    post:
      tags:
        - NLP抽取
      summary: 提交批量结构化解析任务
      description: 【权限：仅管理员】按筛选范围提交后台批量解析任务，立即返回 taskId。任务由服务端固定并发（默认 2）的队列执行，进度与失败清单持久化在 nlp_task 表，可关闭页面后回来查看。每条处理：拼文本→抽取→ES 术语归一→打词典版本→写 structured_data
